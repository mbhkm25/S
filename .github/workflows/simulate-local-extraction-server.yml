name: Simulate SANAD Local Extraction Server

on:
  push:
    branches:
      - feature/sanad-local-extraction-engine
    paths:
      - 'services/sanad-fast-analyzer/**'
      - '.github/workflows/simulate-local-extraction-server.yml'
  pull_request:
    paths:
      - 'services/sanad-fast-analyzer/**'
      - '.github/workflows/simulate-local-extraction-server.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref/commit to simulate
        required: true
        default: feature/sanad-local-extraction-engine

permissions:
  contents: read

concurrency:
  group: sanad-local-sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Boot full Docker stack and exercise OCR/analyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate candidate source
        working-directory: services/sanad-fast-analyzer
        run: |
          set -euo pipefail
          docker compose -f docker-compose.local.yml config >/dev/null
          python -m py_compile ocr-runtime/app.py

      - name: Boot simulated server
        working-directory: services/sanad-fast-analyzer
        run: |
          set -euo pipefail
          docker compose -p sanad-local-sim -f docker-compose.local.yml up -d --build

          echo 'Waiting for OCR readiness...'
          ocr_ok=0
          for _ in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8091/health/ready >/tmp/ocr-ready.json 2>/dev/null; then
              ocr_ok=1
              break
            fi
            sleep 3
          done
          if [ "$ocr_ok" -ne 1 ]; then
            echo 'OCR failed simulated-server readiness' >&2
            curl --silent --show-error --max-time 3 http://127.0.0.1:8091/health/ready >&2 || true
            exit 11
          fi

          echo 'Waiting for analyzer readiness...'
          analyzer_ok=0
          for _ in $(seq 1 40); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8090/health/ready >/tmp/analyzer-ready.json 2>/dev/null; then
              analyzer_ok=1
              break
            fi
            sleep 2
          done
          if [ "$analyzer_ok" -ne 1 ]; then
            echo 'Analyzer failed simulated-server readiness' >&2
            curl --silent --show-error --max-time 3 http://127.0.0.1:8090/health/ready >&2 || true
            exit 12
          fi

          # Generate a deterministic, valid PNG on the runner using only Python stdlib.
          # This avoids docker-exec stdin quirks and external image-tool dependencies.
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          width, height = 640, 180
          rows = []
          for y in range(height):
              row = bytearray()
              for x in range(width):
                  # White background with several black bars so OCR receives a realistic
                  # non-empty raster while the smoke test remains deterministic.
                  black = (
                      32 <= x < 250 and 48 <= y < 62
                      or 32 <= x < 420 and 78 <= y < 92
                      or 32 <= x < 330 and 108 <= y < 122
                  )
                  v = 0 if black else 255
                  row.extend((v, v, v))
              rows.append(b'\x00' + bytes(row))

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          raw = b''.join(rows)
          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(raw, 9))
              + chunk(b'IEND', b'')
          )
          Path('/tmp/sanad-sim.png').write_bytes(png)
          print(f'smoke_png_bytes={len(png)}')
          PY

          set +e
          ocr_http=$(curl --silent --show-error --max-time 30 \
            -o /tmp/ocr-inference.json -w '%{http_code}' \
            -H 'Content-Type: image/png' \
            --data-binary @/tmp/sanad-sim.png \
            http://127.0.0.1:8091/v1/ocr)
          ocr_curl=$?

          analyzer_http=$(curl --silent --show-error --max-time 30 \
            -o /tmp/analyzer-inference.json -w '%{http_code}' \
            -H 'Content-Type: image/png' \
            --data-binary @/tmp/sanad-sim.png \
            http://127.0.0.1:8090/v1/analyze)
          analyzer_curl=$?
          set -e

          echo "OCR_HTTP_STATUS=$ocr_http OCR_CURL_EXIT=$ocr_curl"
          echo 'OCR_RESPONSE_BEGIN'
          cat /tmp/ocr-inference.json 2>/dev/null || true
          echo
          echo 'OCR_RESPONSE_END'
          echo "ANALYZER_HTTP_STATUS=$analyzer_http ANALYZER_CURL_EXIT=$analyzer_curl"
          echo 'ANALYZER_RESPONSE_BEGIN'
          cat /tmp/analyzer-inference.json 2>/dev/null || true
          echo
          echo 'ANALYZER_RESPONSE_END'

          if [ "$ocr_curl" -ne 0 ] || [ "$ocr_http" != "200" ]; then
            echo 'OCR HTTP smoke request failed' >&2
            exit 21
          fi
          if [ "$analyzer_curl" -ne 0 ] || [ "$analyzer_http" != "200" ]; then
            echo 'Analyzer HTTP smoke request failed' >&2
            exit 22
          fi

          python3 - <<'PY'
          import json
          ocr_ready=json.load(open('/tmp/ocr-ready.json'))
          analyzer_ready=json.load(open('/tmp/analyzer-ready.json'))
          ocr=json.load(open('/tmp/ocr-inference.json'))
          analyzer=json.load(open('/tmp/analyzer-inference.json'))
          assert ocr_ready.get('ok') is True, ocr_ready
          assert ocr_ready.get('model_loaded') is True, ocr_ready
          assert ocr_ready.get('inference_ready') is True, ocr_ready
          assert analyzer_ready.get('ok') is True, analyzer_ready
          assert isinstance(ocr.get('raw_text'), str), ocr
          assert isinstance(ocr.get('blocks'), list), ocr
          assert isinstance(analyzer, dict), analyzer
          print('SIMULATION_OK')
          print('ocr_engine='+str(ocr_ready.get('engine')))
          print('ocr_provider='+str(ocr.get('provider')))
          print('ocr_text_chars='+str(len(ocr.get('raw_text') or '')))
          print('analyzer_status='+str((analyzer.get('result') or {}).get('status')))
          PY

          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' sanad-local-ocr sanad-local-analyzer || true

      - name: Dump diagnostics on failure
        if: failure()
        working-directory: services/sanad-fast-analyzer
        run: |
          echo '--- compose ---'
          docker compose -p sanad-local-sim -f docker-compose.local.yml ps -a || true
          echo '--- OCR readiness ---'
          curl --silent --show-error --max-time 3 http://127.0.0.1:8091/health/ready || true
          echo
          echo '--- analyzer readiness ---'
          curl --silent --show-error --max-time 3 http://127.0.0.1:8090/health/ready || true
          echo
          echo '--- captured OCR response ---'
          cat /tmp/ocr-inference.json 2>/dev/null || true
          echo
          echo '--- captured analyzer response ---'
          cat /tmp/analyzer-inference.json 2>/dev/null || true
          echo
          echo '--- OCR logs ---'
          docker compose -p sanad-local-sim -f docker-compose.local.yml logs --no-color --tail=260 sanad-local-ocr || true
          echo '--- analyzer logs ---'
          docker compose -p sanad-local-sim -f docker-compose.local.yml logs --no-color --tail=220 sanad-local-analyzer || true

      - name: Cleanup simulation
        if: always()
        working-directory: services/sanad-fast-analyzer
        run: docker compose -p sanad-local-sim -f docker-compose.local.yml down -v --remove-orphans || true
