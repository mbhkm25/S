name: Benchmark SANAD Local Extraction

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Private corpus batch directory under shared/private-corpus
        required: true
        default: pilot-01
      timeout_seconds:
        description: Per-document analyzer timeout
        required: true
        default: "30"

permissions:
  contents: read

concurrency:
  group: sanad-local-extraction-benchmark
  cancel-in-progress: false

jobs:
  smoke:
    name: Run private smoke benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SANAD_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SANAD_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Run smoke benchmark on SANAD server
        shell: bash
        env:
          HOST: ${{ secrets.SANAD_SERVER_HOST }}
          USER: ${{ secrets.SANAD_SERVER_USER }}
          PORT: ${{ secrets.SANAD_SERVER_PORT }}
          BATCH: ${{ inputs.batch }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          case "$BATCH" in
            *[!A-Za-z0-9._-]*|'') echo "Invalid batch name" >&2; exit 2 ;;
          esac
          ssh -p "${PORT:-22}" "$USER@$HOST" "BATCH='$BATCH' TIMEOUT_SECONDS='$TIMEOUT_SECONDS' bash -s" <<'REMOTE'
          set -euo pipefail
          root=/opt/sanad-local-extraction
          corpus="$root/shared/private-corpus/$BATCH"
          reports="$root/shared/benchmark-reports"
          test -d "$corpus" || { echo "Missing corpus: $corpus" >&2; exit 5; }
          curl --fail --silent http://127.0.0.1:8090/health/ready >/tmp/sanad-local-ready.json
          mkdir -p "$reports"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          report="$reports/${BATCH}-smoke-${stamp}.json"
          CORPUS="$corpus" REPORT="$report" TIMEOUT_SECONDS="$TIMEOUT_SECONDS" python3 - <<'PY'
          import json, mimetypes, os, pathlib, statistics, time, urllib.request, urllib.error
          from collections import Counter
          corpus=pathlib.Path(os.environ['CORPUS']); report=pathlib.Path(os.environ['REPORT']); timeout=float(os.environ['TIMEOUT_SECONDS'])
          allowed={'.jpg','.jpeg','.png','.webp','.pdf'}
          files=sorted(p for p in corpus.iterdir() if p.is_file() and p.suffix.lower() in allowed)
          rows=[]
          for p in files:
              mime=mimetypes.guess_type(p.name)[0] or ('application/pdf' if p.suffix.lower()=='.pdf' else 'application/octet-stream')
              req=urllib.request.Request('http://127.0.0.1:8090/v1/analyze',data=p.read_bytes(),method='POST',headers={'Content-Type':mime,'X-SANAD-Filename':p.name})
              started=time.perf_counter(); status=None; payload=None; error=None
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      status=r.status; payload=json.loads(r.read())
              except urllib.error.HTTPError as e:
                  status=e.code
                  try: payload=json.loads(e.read())
                  except Exception: error=f'HTTP {e.code}'
              except Exception as e: error=f'{type(e).__name__}: {e}'
              wall=round((time.perf_counter()-started)*1000,3)
              result=(payload or {}).get('result') if isinstance(payload,dict) else None
              diagnostics=(result or {}).get('diagnostics') or {}
              rows.append({'file':p.name,'httpStatus':status,'wallMs':wall,'error':error,'status':(result or {}).get('status'),'fallbackRecommended':(result or {}).get('fallbackRecommended'),'parser':diagnostics.get('parser'),'extraction':(result or {}).get('extraction')})
          walls=[r['wallMs'] for r in rows]
          def pct(xs,q):
              if not xs:return 0
              xs=sorted(xs); return xs[max(0,min(len(xs)-1,int((len(xs)*q+0.999999))-1))]
          summary={'cases':len(rows),'successfulHttpCases':sum(r['httpStatus']==200 for r in rows),'failedCases':sum(r['httpStatus']!=200 for r in rows),'p50WallMs':pct(walls,.5),'p95WallMs':pct(walls,.95),'meanWallMs':round(statistics.fmean(walls),3) if walls else 0,'fallbackRate':round(sum(bool(r['fallbackRecommended']) for r in rows)/len(rows),4) if rows else 1,'statuses':dict(Counter(str(r['status']) for r in rows)),'parsers':dict(Counter(str(r['parser']) for r in rows)),'errors':dict(Counter(str(r['error']) for r in rows if r['error']))}
          report.write_text(json.dumps({'mode':'smoke','summary':summary,'results':rows},ensure_ascii=False,indent=2))
          print('--- SANAD LOCAL EXTRACTION SMOKE SUMMARY ---')
          for k in ('cases','successfulHttpCases','failedCases','p50WallMs','p95WallMs','meanWallMs','fallbackRate'): print(f'{k}={summary[k]}')
          print('statuses='+json.dumps(summary['statuses'],ensure_ascii=False,sort_keys=True))
          print('parsers='+json.dumps(summary['parsers'],ensure_ascii=False,sort_keys=True))
          print('errors='+json.dumps(summary['errors'],ensure_ascii=False,sort_keys=True))
          print('private_report='+str(report))
          PY
          REMOTE
