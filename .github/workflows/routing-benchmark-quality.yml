name: Routing benchmark quality

on:
  pull_request:
    paths:
      - "public/routing-benchmark.html"
      - "public/routing-benchmark.css"
      - "public/routing-benchmark-v2.css"
      - "public/routing-benchmark-v2.js"
      - "supabase/migrations/*benchmark*"
      - "supabase/tests/*benchmark*"
      - ".github/workflows/routing-benchmark-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check standalone JavaScript syntax
        run: node --check public/routing-benchmark-v2.js

      - name: Check required page assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/routing-benchmark.html
          test -s public/routing-benchmark.css
          test -s public/routing-benchmark-v2.css
          test -s public/routing-benchmark-v2.js
          grep -Fq '/routing-benchmark.css' public/routing-benchmark.html
          grep -Fq '/routing-benchmark-v2.css' public/routing-benchmark.html
          grep -Fq '/routing-benchmark-v2.js' public/routing-benchmark.html

      - name: Enforce dual-review invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "independent_secondary_reviewer_required" supabase/migrations/*dual_review*.sql
          grep -Fq "independent_adjudicator_required" supabase/migrations/*dual_review*.sql
          grep -Fq "activation_allowed',false" supabase/migrations/*dual_review*.sql
          grep -Fq "blind_secondary_review" public/routing-benchmark-v2.js

      - name: Enforce shadow-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq "activate[_ -]?routing|enable[_ -]?routing|create_business_operation_link" public/routing-benchmark-v2.js
          ! grep -Eiq "insert[[:space:]]+into[[:space:]]+public\.business_operation_links|link_operation_to_business" supabase/migrations/*dual_review*.sql
