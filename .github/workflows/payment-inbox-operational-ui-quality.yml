name: Payment inbox operational UI quality

on:
  pull_request:
    paths:
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/components/business/BusinessOperations.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-admin.html'
      - '.github/workflows/payment-inbox-operational-ui-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/components/business/BusinessOperations.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-admin.html'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate cashier and supervisor separation
        shell: bash
        run: |
          set -euo pipefail
          ui='src/components/business/PaymentInbox.tsx'
          grep -Fq "{ value: 'new', label: 'جديدة' }" "$ui"
          grep -Fq "{ value: 'mine', label: 'لدي' }" "$ui"
          grep -Fq "{ value: 'team_active', label: 'لدى الفريق' }" "$ui"
          grep -Fq "{ value: 'review', label: 'تحتاج مراجعة' }" "$ui"
          grep -Fq 'إدارة وارد المدفوعات' "$ui"
          grep -Fq 'action_permissions' "$ui"
          grep -Fq 'min-h-11' "$ui"
          grep -Fq 'dir="ltr"' "$ui"
      - name: Validate legacy redirects
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "view', 'payment-inbox'" public/payment-inbox.html
          grep -Fq "view', 'payment-inbox-admin'" public/payment-inbox-admin.html
          grep -Fq '/business/manage/operations' public/payment-inbox.html
          grep -Fq '/business/manage/operations' public/payment-inbox-admin.html
