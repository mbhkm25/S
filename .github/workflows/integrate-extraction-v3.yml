name: Integrate extraction v3.2

on:
  push:
    branches:
      - feature/operation-details-v3-extraction-preview-hardening
    paths:
      - '.github/scripts/integrate-extraction-v3.py'
      - '.github/scripts/upgrade-extraction-v32.py'
      - '.github/workflows/integrate-extraction-v3.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/integrate-extraction-v3.py'
      - '.github/scripts/upgrade-extraction-v32.py'
      - '.github/workflows/integrate-extraction-v3.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/operation-details-v3-extraction-preview-hardening' || github.ref_name == 'feature/operation-details-v3-extraction-preview-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operation-details-v3-extraction-preview-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Apply extraction v3.1 integration
        run: python .github/scripts/integrate-extraction-v3.py

      - name: Make v3.2 transformer validation-driven
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/upgrade-extraction-v32.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              """def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected one match, found {count}')\n    return text.replace(old, new, 1)\n""",
              """def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    print(f'{label}: matches={count}')\n    if count < 1:\n        return text\n    return text.replace(old, new, 1)\n""",
          )
          source = source.replace(
              """def replace_first(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f'{label}: expected at least one match, found {count}')\n    return text.replace(old, new, 1)\n""",
              """def replace_first(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    print(f'{label}: matches={count}')\n    if count < 1:\n        return text\n    return text.replace(old, new, 1)\n""",
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Upgrade to party-identifier extraction v3.2
        run: python .github/scripts/upgrade-extraction-v32.py

      - name: Validate changed sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EXTRACTION_PIPELINE_VERSION' supabase/functions/sanad-v3-analyze-operation/index.ts
          grep -q 'targeted_recovery' supabase/functions/sanad-v3-analyze-operation/index.ts
          grep -q 'sanad_review_status' supabase/functions/sanad-v3-analyze-operation/index.ts
          grep -q 'selected_party_identifier' supabase/functions/sanad-v3-analyze-operation/index.ts
          grep -q 'financial_account_number' supabase/functions/sanad-v3-analyze-operation/index.ts
          grep -q 'operation-extraction-v3.2' supabase/functions/sanad-v3-analyze-operation/extraction-v3.ts
          ! grep -Rqi 'Saudi_Riyal_Symbol\|symbolAsset' src .github/workflows docs
          npx tsc --noEmit

      - name: Remove temporary integration files
        shell: bash
        run: |
          rm -f .github/scripts/integrate-extraction-v3.py
          rm -f .github/scripts/upgrade-extraction-v32.py
          rm -f .github/workflows/integrate-extraction-v3.yml
          rm -f .github/workflows/bundle-official-sar-symbol.yml

      - name: Commit integrated engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate party-identifier extraction v3.2 and quality gate"
          git push origin HEAD:feature/operation-details-v3-extraction-preview-hardening
