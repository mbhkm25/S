name: SANAD Local v0.2

on:
  pull_request:
    paths:
      - 'apps/sanad_local/**'
      - 'supabase/functions/sanad-local-text-analysis/**'
      - '.github/workflows/sanad-local-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sanad-local-mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    name: Live semantic backend contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check isolated Edge Function
        run: deno check --config supabase/functions/sanad-local-text-analysis/deno.json supabase/functions/sanad-local-text-analysis/index.ts
      - name: Prove anonymous callers are rejected
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            https://hudbzlgclghlhazlduas.supabase.co/functions/v1/sanad-local-text-analysis)"
          cat "$body"
          test "$status" = "401"
      - name: Get signed GitHub OIDC test identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sanad-local-ci")"
          token="$(jq -r '.value' <<<"$response")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Exercise live OCR-text to Gemini contract
        env:
          CI_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"local_operation_id":"ci-local-001","analysis_revision":1,"ocr_provider":"ci_fixture","ocr_confidence":0.99,"ocr_text":"العمقي موبايل\nالمبلغ 500 SAR\nرقم العملية 8-342038458\nالتاريخ 2026-08-11"}'
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CI_TOKEN" \
            --header 'content-type: application/json' \
            --data "$payload" \
            https://hudbzlgclghlhazlduas.supabase.co/functions/v1/sanad-local-text-analysis)"
          jq . <<<"$response"
          test "$(jq -r '.ok' <<<"$response")" = "true"
          test "$(jq -r '.principal' <<<"$response")" = "github_ci"
          test "$(jq -r '.structured.financialEntityCode' <<<"$response")" = "alomqi"
          test "$(jq -r '.structured.amount' <<<"$response")" = "500"
          test "$(jq -r '.structured.currency' <<<"$response")" = "SAR"
          test "$(jq -r '.structured.documentReference' <<<"$response")" = "8-342038458"

  android-mvp:
    name: Flutter + Android emulator + release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install fixture dependency
        run: python3 -m pip install --user pillow
      - name: Restore stable Android signing key when available
        env:
          KEYSTORE_BASE64: ${{ secrets.SANAD_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SANAD_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SANAD_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SANAD_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          values=("$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do [[ -n "$value" ]] && present=$((present + 1)); done
          if [[ "$present" = 0 ]]; then
            echo "Stable signing secrets are unavailable; this CI run will use the non-publishable test key."
            exit 0
          fi
          [[ "$present" = 4 ]] || { echo "Android signing secrets are incomplete." >&2; exit 1; }
          install -m 700 -d "$RUNNER_TEMP/sanad-local-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sanad-local-signing/sanad-release.jks"
          chmod 600 "$RUNNER_TEMP/sanad-local-signing/sanad-release.jks"
          test -s "$RUNNER_TEMP/sanad-local-signing/sanad-release.jks"
      - name: Create Android platform with native OCR bridge
        working-directory: apps/sanad_local
        env:
          SANAD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sanad-local-signing/sanad-release.jks
          SANAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SANAD_ANDROID_KEYSTORE_PASSWORD }}
          SANAD_ANDROID_KEY_ALIAS: ${{ secrets.SANAD_ANDROID_KEY_ALIAS }}
          SANAD_ANDROID_KEY_PASSWORD: ${{ secrets.SANAD_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: bash tool/bootstrap_android.sh
      - name: Static analysis
        working-directory: apps/sanad_local
        run: flutter analyze --fatal-infos
      - name: Unit tests
        working-directory: apps/sanad_local
        run: flutter test --no-pub test
      - name: Prepare production-only dependency graph
        working-directory: apps/sanad_local
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml pubspec.testing.yaml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text()
          block = '  integration_test:\n    sdk: flutter\n'
          if block not in text:
              raise SystemExit('integration_test dev dependency block not found')
          path.write_text(text.replace(block, '', 1))
          PY
          flutter clean
          flutter pub get
      - name: Build release APK
        working-directory: apps/sanad_local
        env:
          SANAD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sanad-local-signing/sanad-release.jks
          SANAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SANAD_ANDROID_KEYSTORE_PASSWORD }}
          SANAD_ANDROID_KEY_ALIAS: ${{ secrets.SANAD_ANDROID_KEY_ALIAS }}
          SANAD_ANDROID_KEY_PASSWORD: ${{ secrets.SANAD_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --no-pub --dart-define=SANAD_SUPABASE_URL=https://api.sanadflow.com
      - name: Verify APK signatures and package identity
        working-directory: apps/sanad_local
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          for apk in build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            "$AAPT" dump badging "$apk" | grep -Fq "package: name='com.sanadflow.local'"
          done
      - name: Record APK sizes and checksums
        working-directory: apps/sanad_local
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          sha256sum app-armeabi-v7a-release.apk app-arm64-v8a-release.apk > SHA256SUMS
          ls -lh app-armeabi-v7a-release.apk app-arm64-v8a-release.apk
      - name: Prepare isolated SANAD Local release contract
        working-directory: apps/sanad_local
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/app/outputs/flutter-apk
          APK="$OUT/app-arm64-v8a-release.apk"
          cp "$APK" "$OUT/sanad-local-latest.apk"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c '%s' "$APK")"
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\1/p' pubspec.yaml)"
          CODE="$(sed -nE 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\2/p' pubspec.yaml)"
          jq -n \
            --arg version_name "$VERSION" \
            --argjson version_code "$CODE" \
            --arg sha256 "$SHA" \
            --argjson size_bytes "$SIZE" \
            --arg commit "$GITHUB_SHA" \
            '{platform:"android",application_id:"com.sanadflow.local",abi:"arm64-v8a",version_name:$version_name,version_code:$version_code,minimum_supported_version_code:2,update_policy:"recommended",release_notes:["حزمة أصغر مخصصة لهواتف ARM64","تحديث آمن من داخل سند المحلي"],filename:"sanad-local-latest.apk",download_url:"/downloads/sanad-local-latest.apk",sha256:$sha256,size_bytes:$size_bytes,commit:$commit,built_at:(now|todateiso8601)}' \
            > "$OUT/sanad-local-latest.json"
          printf '%s  %s\n' "$SHA" sanad-local-latest.apk > "$OUT/sanad-local-latest.apk.sha256"
          jq . "$OUT/sanad-local-latest.json"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sanad-local-v0.2-apk
          path: |
            apps/sanad_local/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/sanad_local/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            apps/sanad_local/build/app/outputs/flutter-apk/SHA256SUMS
            apps/sanad_local/build/app/outputs/flutter-apk/sanad-local-latest.apk
            apps/sanad_local/build/app/outputs/flutter-apk/sanad-local-latest.apk.sha256
            apps/sanad_local/build/app/outputs/flutter-apk/sanad-local-latest.json
          if-no-files-found: error
          retention-days: 14
      - name: Restore integration-test dependency graph
        working-directory: apps/sanad_local
        shell: bash
        run: |
          set -euo pipefail
          mv pubspec.testing.yaml pubspec.yaml
          flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android runtime gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: apps/sanad_local
          script: flutter test integration_test/mvp_integration_test.dart -d emulator-5554 --no-pub
