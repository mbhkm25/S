name: SANAD Local MVP

on:
  pull_request:
    paths:
      - 'apps/sanad_local/**'
      - 'supabase/functions/sanad-local-text-analysis/**'
      - '.github/workflows/sanad-local-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sanad-local-mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    name: Live semantic backend contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check isolated Edge Function
        run: deno check --config supabase/functions/sanad-local-text-analysis/deno.json supabase/functions/sanad-local-text-analysis/index.ts
      - name: Prove anonymous callers are rejected
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            https://hudbzlgclghlhazlduas.supabase.co/functions/v1/sanad-local-text-analysis)"
          cat "$body"
          test "$status" = "401"
      - name: Get signed GitHub OIDC test identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sanad-local-ci")"
          token="$(jq -r '.value' <<<"$response")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Exercise live OCR-text to Gemini contract
        env:
          CI_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"local_operation_id":"ci-local-001","analysis_revision":1,"ocr_provider":"ci_fixture","ocr_confidence":0.99,"ocr_text":"العمقي موبايل\nالمبلغ 500 SAR\nرقم العملية 8-342038458\nالتاريخ 2026-08-11"}'
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CI_TOKEN" \
            --header 'content-type: application/json' \
            --data "$payload" \
            https://hudbzlgclghlhazlduas.supabase.co/functions/v1/sanad-local-text-analysis)"
          jq . <<<"$response"
          test "$(jq -r '.ok' <<<"$response")" = "true"
          test "$(jq -r '.principal' <<<"$response")" = "github_ci"
          test "$(jq -r '.structured.financialEntityCode' <<<"$response")" = "alomqi"
          test "$(jq -r '.structured.amount' <<<"$response")" = "500"
          test "$(jq -r '.structured.currency' <<<"$response")" = "SAR"
          test "$(jq -r '.structured.documentReference' <<<"$response")" = "8-342038458"

  android-mvp:
    name: Flutter + Android emulator + release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install fixture dependency
        run: python3 -m pip install --user pillow
      - name: Create Android platform with native OCR bridge
        working-directory: apps/sanad_local
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.sanadflow --project-name sanad_local .
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('applicationId = "com.sanadflow.sanad_local"', 'applicationId = "com.sanadflow.local"')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          if 'cz.adaptech.tesseract4android:tesseract4android:4.9.0' not in text:
              text += '\n\ndependencies {\n    implementation("cz.adaptech.tesseract4android:tesseract4android:4.9.0")\n}\n'
          gradle.write_text(text)

          jitpack = 'maven { url = uri("https://jitpack.io") }'

          root_gradle = Path('android/build.gradle.kts')
          root_text = root_gradle.read_text()
          if jitpack not in root_text:
              allprojects = root_text.index('allprojects {')
              anchor = root_text.index('repositories {', allprojects)
              insert_at = anchor + len('repositories {')
              root_text = root_text[:insert_at] + '\n        ' + jitpack + root_text[insert_at:]
          root_gradle.write_text(root_text)

          settings = Path('android/settings.gradle.kts')
          s = settings.read_text()
          if jitpack not in s:
              if 'dependencyResolutionManagement {' in s:
                  anchor = s.index('repositories {', s.index('dependencyResolutionManagement {'))
                  insert_at = anchor + len('repositories {')
                  s = s[:insert_at] + '\n        ' + jitpack + s[insert_at:]
              else:
                  s += '\n\ndependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n        ' + jitpack + '\n    }\n}\n'
          settings.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          marker = '<application'
          perms = '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.CAMERA' not in m:
              m = m.replace(marker, perms + marker, 1)
          manifest.write_text(m)
          PY
          cp tool/android/MainActivity.kt android/app/src/main/kotlin/com/sanadflow/sanad_local/MainActivity.kt
      - name: Prepare fully offline runtime assets
        working-directory: apps/sanad_local
        run: bash tool/prepare_assets.sh
      - name: Resolve dependencies
        working-directory: apps/sanad_local
        run: flutter pub get
      - name: Static analysis
        working-directory: apps/sanad_local
        run: flutter analyze --fatal-infos
      - name: Unit tests
        working-directory: apps/sanad_local
        run: flutter test --no-pub test
      - name: Prepare production-only dependency graph
        working-directory: apps/sanad_local
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml pubspec.testing.yaml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text()
          block = '  integration_test:\n    sdk: flutter\n'
          if block not in text:
              raise SystemExit('integration_test dev dependency block not found')
          path.write_text(text.replace(block, '', 1))
          PY
          flutter clean
          flutter pub get
      - name: Build release APK
        working-directory: apps/sanad_local
        run: flutter build apk --release --no-pub --dart-define=SANAD_SUPABASE_URL=https://api.sanadflow.com
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sanad-local-mvp-apk
          path: apps/sanad_local/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Restore integration-test dependency graph
        working-directory: apps/sanad_local
        shell: bash
        run: |
          set -euo pipefail
          mv pubspec.testing.yaml pubspec.yaml
          flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android runtime gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: apps/sanad_local
          script: flutter test integration_test/mvp_integration_test.dart -d emulator-5554 --no-pub
