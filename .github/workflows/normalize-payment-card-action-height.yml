name: Normalize payment card action height

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/normalize-payment-card-action-height.yml'
      - '.github/scripts/normalize-payment-card-action-height.py'
      - 'src/components/business/PaymentInbox.tsx'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payment-inbox-visual-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Normalize action height
        run: |
          python .github/scripts/normalize-payment-card-action-height.py
          rm .github/scripts/normalize-payment-card-action-height.py

      - name: Validate
        run: |
          npx tsc --noEmit
          npm run build
          grep -Fq 'min-h-11' src/components/business/PaymentInbox.tsx

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize payment inbox action heights"
          git pull --rebase origin feature/payment-inbox-visual-cards
          git push origin HEAD:feature/payment-inbox-visual-cards
