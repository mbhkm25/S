name: Payment inbox quality

on:
  pull_request:
    paths:
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/components/business/BusinessOperations.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'src/features/operations/OperationDetailsActionIntent.tsx'
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-admin.html'
      - 'supabase/migrations/*payment_inbox*'
      - 'supabase/tests/*payment_inbox*'
      - '.github/workflows/payment-inbox-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/components/business/BusinessOperations.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'src/features/operations/OperationDetailsActionIntent.tsx'
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-admin.html'
      - 'supabase/migrations/*payment_inbox*'
      - 'supabase/tests/*payment_inbox*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate React payment inbox integration
        shell: bash
        run: |
          set -euo pipefail
          test -s src/components/business/PaymentInbox.tsx
          test -s src/lib/paymentInboxApi.ts
          grep -Fq "view === 'payment-inbox'" src/components/business/BusinessOperations.tsx
          grep -Fq "view === 'payment-inbox-admin'" src/components/business/BusinessOperations.tsx
          grep -Fq "get_business_payment_inbox_v2" src/lib/paymentInboxApi.ts
          grep -Fq "get_my_business_payment_inbox_contexts_v2" src/lib/paymentInboxApi.ts
          grep -Fq 'p_expected_row_version' src/lib/paymentInboxApi.ts
          grep -Fq 'action_permissions' src/components/business/PaymentInbox.tsx
          grep -Fq 'استلام العملية' src/components/business/PaymentInbox.tsx
          grep -Fq 'استلام وتحقق' src/components/business/PaymentInbox.tsx
          grep -Fq '/business/manage/operations' public/payment-inbox.html
          grep -Fq '/business/manage/operations' public/payment-inbox-admin.html
      - name: Validate atomic database contracts
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260802171000_payment_inbox_workflow_hardening.sql'
          test -s "$migration"
          grep -Fq 'for update' "$migration"
          grep -Fq 'p_expected_row_version' "$migration"
          grep -Fq "'claim_race_lost'" "$migration"
          grep -Fq "'stale_item'" "$migration"
          test -s supabase/tests/payment_inbox_workflow_hardening.sql
          grep -Fq 'rollback;' supabase/tests/payment_inbox_workflow_hardening.sql
