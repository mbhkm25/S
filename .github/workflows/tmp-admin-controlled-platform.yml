name: Temporary controlled admin refactor

on:
  push:
    branches:
      - feature/admin-control-center-foundation
    paths:
      - '.github/workflows/tmp-admin-controlled-platform.yml'

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-admin-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-control-center-foundation
          fetch-depth: 0
      - name: Patch PlatformAdmin
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/admin/PlatformAdmin.tsx')
          s = p.read_text()
          s = s.replace("type Tab = 'overview' | 'users' | 'whatsapp' | 'operations' | 'businesses' | 'pro' | 'settings' | 'audit';", "export type PlatformAdminTab = 'overview' | 'users' | 'whatsapp' | 'operations' | 'businesses' | 'pro' | 'settings' | 'audit';")
          s = s.replace("interface Props {\n  onNavigate: (page: string, token?: string) => void;\n}", "interface Props {\n  onNavigate: (page: string, token?: string) => void;\n  activeTab?: PlatformAdminTab;\n  onTabChange?: (tab: PlatformAdminTab) => void;\n  embedded?: boolean;\n}")
          s = s.replace("const tabs: Array<{ id: Tab; label: string; icon: typeof Activity }> = [", "const tabs: Array<{ id: PlatformAdminTab; label: string; icon: typeof Activity }> = [")
          s = s.replace("export default function PlatformAdmin({ onNavigate }: Props) {\n  const [tab, setTab] = useState<Tab>('overview');", "export default function PlatformAdmin({ onNavigate, activeTab, onTabChange, embedded = false }: Props) {\n  const [internalTab, setInternalTab] = useState<PlatformAdminTab>('overview');\n  const tab = activeTab ?? internalTab;\n  const setTab = (next: PlatformAdminTab) => {\n    if (activeTab === undefined) setInternalTab(next);\n    onTabChange?.(next);\n    setSearch('');\n  };")
          s = s.replace("      <section className=\"overflow-hidden rounded-[2rem] bg-slate-950 p-5 text-white shadow-xl\">", "      {!embedded && <section className=\"overflow-hidden rounded-[2rem] bg-slate-950 p-5 text-white shadow-xl\">")
          s = s.replace("      </section>\n\n      {error &&", "      </section>}\n\n      {error &&", 1)
          s = s.replace("      <div className=\"no-scrollbar flex gap-2 overflow-x-auto pb-1\">\n        {tabs.map(({ id, label, icon: Icon }) => <button key={id} onClick={() => { setTab(id); setSearch(''); }}", "      {!embedded && <div className=\"no-scrollbar flex gap-2 overflow-x-auto pb-1\">\n        {tabs.map(({ id, label, icon: Icon }) => <button key={id} onClick={() => setTab(id)}")
          s = s.replace("      </div>\n\n      {tab === 'overview'", "      </div>}\n\n      {tab === 'overview'", 1)
          s = s.replace("function Overview({ snapshot, onTab }: { snapshot: PlatformAdminSnapshot; onTab: (tab: Tab) => void })", "function Overview({ snapshot, onTab }: { snapshot: PlatformAdminSnapshot; onTab: (tab: PlatformAdminTab) => void })")
          s = s.replace("'users' as Tab", "'users' as PlatformAdminTab").replace("'operations' as Tab", "'operations' as PlatformAdminTab").replace("'pro' as Tab", "'pro' as PlatformAdminTab").replace("'businesses' as Tab", "'businesses' as PlatformAdminTab")
          required = ["activeTab?: PlatformAdminTab", "embedded?: boolean", "!embedded && <section", "!embedded && <div className=\"no-scrollbar"]
          missing = [item for item in required if item not in s]
          if missing:
            raise SystemExit(f'Missing expected patches: {missing}')
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/PlatformAdmin.tsx
          git commit -m "Make PlatformAdmin externally controlled [skip-admin-patch]"
          git push origin HEAD:feature/admin-control-center-foundation
