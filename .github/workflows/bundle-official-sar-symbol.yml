name: Bundle official SAR symbol

on:
  push:
    branches:
      - feature/operation-details-v3-extraction-preview-hardening
    paths:
      - '.github/workflows/bundle-official-sar-symbol.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operation-details-v3-extraction-preview-hardening
          fetch-depth: 0

      - name: Download and validate official SAMA SVG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/currencies
          curl --fail --location --retry 3 --connect-timeout 15 \
            'https://sama.gov.sa/ar-sa/Currency/Documents/Saudi_Riyal_Symbol-2.svg' \
            --output public/currencies/saudi-riyal-symbol.svg
          test -s public/currencies/saudi-riyal-symbol.svg
          grep -Eiq '<svg([[:space:]>])' public/currencies/saudi-riyal-symbol.svg
          test "$(wc -c < public/currencies/saudi-riyal-symbol.svg)" -lt 200000

      - name: Point currency registry to the bundled asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/currencyRegistry.ts')
          source = path.read_text(encoding='utf-8')
          old = "symbolAsset: 'https://www.sama.gov.sa/ar-sa/Currency/Documents/Saudi_Riyal_Symbol-2.svg',"
          new = "symbolAsset: '/currencies/saudi-riyal-symbol.svg',"
          if old not in source and new not in source:
              raise SystemExit('SAR symbol registry marker not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/bundle-official-sar-symbol.yml

      - name: Commit bundled official symbol
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bundle the official Saudi riyal symbol"
          git push origin HEAD:feature/operation-details-v3-extraction-preview-hardening
