name: Transactional messaging one-time wiring
on:
  push:
    branches:
      - feature/transactional-messaging-and-release
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/transactional-messaging-and-release
      - name: Wire admin UI and delivery status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('src/components/admin/WhatsAppAdminSection.tsx')
          text = ui.read_text()
          anchor = "import AdminAudienceCampaigns from './AdminAudienceCampaigns';"
          if "import TransactionalMessagingAdmin" not in text:
              text = text.replace(anchor, anchor + "\nimport TransactionalMessagingAdmin from './TransactionalMessagingAdmin';", 1)
          marker = "    <AdminAudienceCampaigns setError={setError} setSuccess={setSuccess} />"
          addition = "    <TransactionalMessagingAdmin setError={setError} setSuccess={setSuccess} />"
          if addition not in text:
              text = text.replace(marker, marker + "\n\n" + addition, 1)
          ui.write_text(text)

          intake = Path('supabase/functions/sanad-v3-whatsapp-intake/index.ts')
          text = intake.read_text()
          marker = '''      await supabaseJson(
        "/rest/v1/rpc/apply_whatsapp_campaign_delivery_status",'''
          if 'apply_transactional_whatsapp_delivery_status' not in text:
              insertion = '''      await supabaseJson(
        "/rest/v1/rpc/apply_transactional_whatsapp_delivery_status",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            p_message_id: messageId,
            p_status: deliveryStatus,
            p_event_at: eventAt,
            p_error: errorMessage,
          }),
        },
      );

'''
              text = text.replace(marker, insertion + marker, 1)
          intake.write_text(text)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/WhatsAppAdminSection.tsx supabase/functions/sanad-v3-whatsapp-intake/index.ts
          git commit -m "Integrate transactional message automation center"
          git push origin HEAD:feature/transactional-messaging-and-release
