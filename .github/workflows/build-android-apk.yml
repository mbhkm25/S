name: Build SANAD Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'config/android-release.json'
      - 'scripts/android-release-meta.mjs'
      - 'scripts/android-release-meta.test.mjs'
      - 'scripts/generate-sanad-icons.py'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'config/android-release.json'
      - 'scripts/android-release-meta.mjs'
      - 'scripts/android-release-meta.test.mjs'
      - 'scripts/generate-sanad-icons.py'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: sanad-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-field-test-apk:
    name: Build field-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read Android release metadata
        id: release
        run: node scripts/android-release-meta.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up icon generator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Install dependencies
        run: npm ci
      - name: Validate application and release contract
        run: |
          npm run lint
          npm run check:routes
          npm run check:android-release
          node --test scripts/android-release-meta.test.mjs
      - name: Build Android assets
        env:
          VITE_APP_VERSION: ${{ steps.release.outputs.version_code }}
        run: npm run build:android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
      - name: Prepare field-test artifact
        env:
          SANAD_ANDROID_VERSION: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/sanad-v${SANAD_ANDROID_VERSION}-field-test.apk"
          sha256sum "release/sanad-v${SANAD_ANDROID_VERSION}-field-test.apk" > "release/sanad-v${SANAD_ANDROID_VERSION}-field-test.apk.sha256"
      - name: Upload field-test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanad-v${{ steps.release.outputs.version_code }}-field-test-apk
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-signed-apk:
    name: Publish signed APK
    if: github.event_name != 'pull_request' && vars.SANAD_ANDROID_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://app.sanadflow.com/install/
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read Android release metadata
        id: release
        run: node scripts/android-release-meta.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up icon generator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SANAD_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SANAD_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SANAD_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SANAD_ANDROID_KEY_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$SSH_PRIVATE_KEY" "$SSH_KNOWN_HOSTS" "$HOST" "$DEPLOY_USER"; do
            [[ -n "$value" ]]
          done
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SANAD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/sanad-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sanad-signing/sanad-release.jks"
          chmod 600 "$RUNNER_TEMP/sanad-signing/sanad-release.jks"
          test -s "$RUNNER_TEMP/sanad-signing/sanad-release.jks"
      - name: Install dependencies
        run: npm ci
      - name: Validate application and release contract
        run: |
          npm run lint
          npm run check:routes
          npm run check:android-release
          node --test scripts/android-release-meta.test.mjs
      - name: Build Android assets
        env:
          VITE_APP_VERSION: ${{ steps.release.outputs.version_code }}
        run: npm run build:android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build signed release APK
        working-directory: android
        env:
          SANAD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sanad-signing/sanad-release.jks
          SANAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SANAD_ANDROID_KEYSTORE_PASSWORD }}
          SANAD_ANDROID_KEY_ALIAS: ${{ secrets.SANAD_ANDROID_KEY_ALIAS }}
          SANAD_ANDROID_KEY_PASSWORD: ${{ secrets.SANAD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify release signing continuity
        run: |
          set -euo pipefail

          APKSIGNER="$(command -v apksigner || true)"
          if [[ -z "$APKSIGNER" ]]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \( -type f -o -type l \) -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "Could not locate an executable Android apksigner. Refusing to publish." >&2
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          NEW_APK="android/app/build/outputs/apk/release/app-release.apk"
          OLD_APK="/tmp/sanad-current-production.apk"
          test -s "$NEW_APK"

          curl --fail --silent --show-error --location --max-time 60 \
            --output "$OLD_APK" \
            https://app.sanadflow.com/downloads/sanad-latest.apk
          test -s "$OLD_APK"

          if ! NEW_CERT_OUTPUT="$($APKSIGNER verify --print-certs "$NEW_APK" 2>&1)"; then
            echo "The newly built release APK failed apksigner verification. Refusing to publish." >&2
            printf '%s\n' "$NEW_CERT_OUTPUT" >&2
            exit 1
          fi
          if ! OLD_CERT_OUTPUT="$($APKSIGNER verify --print-certs "$OLD_APK" 2>&1)"; then
            echo "The currently published production APK failed apksigner verification. Refusing to replace it." >&2
            printf '%s\n' "$OLD_CERT_OUTPUT" >&2
            exit 1
          fi

          extract_cert_digest() {
            printf '%s\n' "$1" \
              | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f]{64})[[:space:]]*$/\1/p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          }

          NEW_CERT="$(extract_cert_digest "$NEW_CERT_OUTPUT")"
          OLD_CERT="$(extract_cert_digest "$OLD_CERT_OUTPUT")"

          if [[ ! "$NEW_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not extract a valid SHA-256 certificate digest from the newly built APK. Refusing to publish." >&2
            printf '%s\n' "$NEW_CERT_OUTPUT" >&2
            exit 1
          fi
          if [[ ! "$OLD_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not extract a valid SHA-256 certificate digest from the currently published APK. Refusing to publish." >&2
            printf '%s\n' "$OLD_CERT_OUTPUT" >&2
            exit 1
          fi

          echo "New release certificate SHA-256: $NEW_CERT"
          echo "Current production certificate SHA-256: $OLD_CERT"

          if [[ "$NEW_CERT" != "$OLD_CERT" ]]; then
            echo "Android signing certificate changed. Refusing to publish an APK that cannot update existing SANAD installations." >&2
            exit 1
          fi
          echo "Signing continuity verified."
      - name: Prepare stable release files
        env:
          SANAD_ANDROID_VERSION: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p release
          APK_VERSIONED="sanad-v${SANAD_ANDROID_VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release/$APK_VERSIONED"
          cp "release/$APK_VERSIONED" release/sanad-latest.apk
          node scripts/android-release-meta.mjs manifest release/sanad-latest.apk release/sanad-latest.json "$GITHUB_SHA" >/tmp/sanad-release-sha.txt
          SHA256="$(cat /tmp/sanad-release-sha.txt)"
          printf '%s  %s\n' "$SHA256" sanad-latest.apk > release/sanad-latest.apk.sha256
      - name: Validate generated release manifest
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const crypto=require("crypto");
            const m=JSON.parse(fs.readFileSync("release/sanad-latest.json","utf8"));
            const apk=fs.readFileSync("release/sanad-latest.apk");
            const sha=crypto.createHash("sha256").update(apk).digest("hex");
            if (String(m.version_code)!==process.env.EXPECTED_VERSION) throw new Error("manifest version mismatch");
            if (m.sha256!==sha) throw new Error("manifest SHA mismatch");
            if (!Array.isArray(m.release_notes)) throw new Error("release notes missing");
            if (!["recommended","required"].includes(m.update_policy)) throw new Error("update policy invalid");
          '
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanad-v${{ steps.release.outputs.version_code }}-signed-release
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Publish APK to stable production path
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          SANAD_ANDROID_VERSION: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          REMOTE_TMP="/tmp/sanad-android-${GITHUB_RUN_ID}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP'"
          scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            release/sanad-latest.apk release/sanad-latest.apk.sha256 release/sanad-latest.json \
            "release/sanad-v${SANAD_ANDROID_VERSION}.apk" "$DEPLOY_USER@$HOST:$REMOTE_TMP/"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "sudo /usr/local/sbin/sanad-publish-android-apk '$REMOTE_TMP' '$SANAD_ANDROID_VERSION'"
      - name: Verify public APK and manifest
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 --output /tmp/sanad-latest.apk https://app.sanadflow.com/downloads/sanad-latest.apk
          curl --fail --silent --show-error --location --max-time 30 --output /tmp/sanad-latest.json https://app.sanadflow.com/downloads/sanad-latest.json
          test -s /tmp/sanad-latest.apk
          test -s /tmp/sanad-latest.json
          node -e '
            const fs=require("fs");
            const crypto=require("crypto");
            const manifest=JSON.parse(fs.readFileSync("/tmp/sanad-latest.json","utf8"));
            const apk=fs.readFileSync("/tmp/sanad-latest.apk");
            const sha=crypto.createHash("sha256").update(apk).digest("hex");
            if (String(manifest.version_code)!==process.env.EXPECTED_VERSION) throw new Error("public version mismatch");
            if (manifest.sha256!==sha) throw new Error("public APK SHA does not match manifest");
          '
