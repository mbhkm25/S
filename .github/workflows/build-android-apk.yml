name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build Android web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build installable field-test APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename field-test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sanad-v90-field-test.apk

      - name: Upload field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: sanad-v90-field-test-apk
          path: sanad-v90-field-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release signing key
        if: ${{ secrets.SANAD_ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          SANAD_ANDROID_KEYSTORE_BASE64: ${{ secrets.SANAD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$SANAD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sanad-release.keystore"

      - name: Build signed release APK
        if: ${{ secrets.SANAD_ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          SANAD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sanad-release.keystore
          SANAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SANAD_ANDROID_KEYSTORE_PASSWORD }}
          SANAD_ANDROID_KEY_ALIAS: ${{ secrets.SANAD_ANDROID_KEY_ALIAS }}
          SANAD_ANDROID_KEY_PASSWORD: ${{ secrets.SANAD_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload signed release APK
        if: ${{ secrets.SANAD_ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sanad-v90-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
