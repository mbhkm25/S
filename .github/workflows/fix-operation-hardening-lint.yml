name: Fix operation hardening lint

on:
  push:
    branches:
      - agent/operation-time-file-access-relationship-hardening
    paths:
      - scripts/fix-operation-hardening-lint.mjs
      - .github/workflows/fix-operation-hardening-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operation-time-file-access-relationship-hardening
          fetch-depth: 0
      - run: node scripts/fix-operation-hardening-lint.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix operation hardening TypeScript imports"
          git push origin HEAD:agent/operation-time-file-access-relationship-hardening
