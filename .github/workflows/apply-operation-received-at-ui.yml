name: Apply operation receipt time UI

on:
  push:
    branches:
      - agent/operation-time-file-access-relationship-hardening
    paths:
      - scripts/apply-operation-received-at-ui.mjs
      - .github/workflows/apply-operation-received-at-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operation-time-file-access-relationship-hardening
          fetch-depth: 0
      - run: node scripts/apply-operation-received-at-ui.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show SANAD receipt time in operation details"
          git push origin HEAD:agent/operation-time-file-access-relationship-hardening
