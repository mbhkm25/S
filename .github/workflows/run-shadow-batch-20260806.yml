name: Run shadow batch 20260806

on:
  push:
    branches:
      - feature/sanad-fast-financial-engine
    paths:
      - '.github/workflows/run-shadow-batch-20260806.yml'

permissions:
  contents: read

jobs:
  run-batch:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
      RUN_TOKEN: e836fb87365f4ff19d977c548b6454c1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sanad-fast-financial-engine

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy allow-listed batch runner
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy sanad-shadow-batch-20260806 \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Run nine missing shadow analyses
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --max-time 180 \
            -X POST \
            -H "x-run-token: $RUN_TOKEN" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/sanad-shadow-batch-20260806" \
            | tee /tmp/shadow-batch-result.json

      - name: Close batch runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/functions/sanad-shadow-batch-20260806/index.ts <<'EOF'
          import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          Deno.serve(() => new Response(JSON.stringify({ ok: false, error: "batch_runner_closed" }), {
            status: 410,
            headers: { "content-type": "application/json", "cache-control": "no-store" },
          }));
          EOF
          supabase functions deploy sanad-shadow-batch-20260806 \
            --project-ref "$SUPABASE_PROJECT_REF"
