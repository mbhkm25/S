name: Phone verification one-time Deno repair

on:
  push:
    branches:
      - feature/assistant-v5-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/assistant-v5-foundation
      - name: Repair Deno type compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/sanad-phone-verification/index.ts')
          text = path.read_text()
          text = text.replace('import "jsr:@supabase/functions-js/edge-runtime.d.ts";\n\n', '', 1)
          text = text.replace('const body = await status.json().catch(() => null);', 'const body: any = await status.json().catch(() => null);', 1)
          path.write_text(text)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/sanad-phone-verification/index.ts
          git commit -m "Fix phone verification Deno compatibility"
          git push origin HEAD:feature/assistant-v5-foundation
