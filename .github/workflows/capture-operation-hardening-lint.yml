name: Capture operation hardening lint diagnostics

on:
  push:
    branches:
      - agent/operation-time-file-access-relationship-hardening
    paths:
      - .github/workflows/capture-operation-hardening-lint.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operation-time-file-access-relationship-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture TypeScript output
        shell: bash
        run: |
          set +e
          npm run lint > operation-hardening-lint.txt 2>&1
          status=$?
          echo "exit_code=$status" >> operation-hardening-lint.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operation-hardening-lint.txt
          git commit -m "Capture operation hardening lint diagnostics"
          git push origin HEAD:agent/operation-time-file-access-relationship-hardening
