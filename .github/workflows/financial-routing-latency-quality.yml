name: Financial routing latency quality

on:
  pull_request:
    paths:
      - "supabase/functions/deno.json"
      - "supabase/functions/sanad-v3-whatsapp-intake/**"
      - "supabase/functions/sanad-operation-analysis-worker/**"
      - "supabase/migrations/*instant_intake_event_pipeline*"
      - "supabase/migrations/*pipeline_observability*"
      - "supabase/tests/*event_pipeline*"
      - "supabase/migrations/*pipeline_latency*"
      - "supabase/tests/*pipeline_latency*"
      - ".github/workflows/financial-routing-latency-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check WhatsApp intake
        run: deno check --config supabase/functions/deno.json supabase/functions/sanad-v3-whatsapp-intake/index.ts

      - name: Deno check durable analysis worker
        run: deno check --config supabase/functions/deno.json supabase/functions/sanad-operation-analysis-worker/index.ts

      - name: Enforce intake latency and privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'api.qrserver.com' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -Fiq 'x-hub-signature-256' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -Fq 'verifyMetaSignature' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          ! grep -Fq 'sanad-v3-analyze-operation' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          ! grep -Fq 'analysisPromise' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          ! grep -Fq 'waitUntil' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -Fq 'claim_whatsapp_operation_intake' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -Fq 'finalize_whatsapp_operation_intake' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -Fq 'internal:qrcode@1.5.4' supabase/functions/sanad-v3-whatsapp-intake/index.ts

      - name: Enforce durable analysis and telemetry contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'claim_operation_analysis_jobs' supabase/functions/sanad-operation-analysis-worker/index.ts
          grep -Fq 'request_operation_analysis_dispatch' supabase/functions/sanad-operation-analysis-worker/index.ts
          grep -Fq 'sanad-operation-analysis-primary' supabase/functions/sanad-operation-analysis-worker/index.ts
          grep -Fq 'private.pipeline_dispatch_leases' supabase/migrations/*instant_intake_event_pipeline*.sql
          grep -Fq 'operation_pipeline_spans' supabase/migrations/*instant_intake_event_pipeline*.sql
          grep -Fq 'queue_wait_ms' supabase/migrations/*pipeline_observability*.sql
          grep -Fq 'execution_ms' supabase/migrations/*pipeline_observability*.sql
