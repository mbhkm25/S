name: Apply team payment inbox completed tab

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-team-payment-inbox-completed-tab.yml'
      - '.github/scripts/add-team-payment-inbox-completed-tab.py'
      - 'src/components/business/PaymentInbox.tsx'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/team-payment-inbox-completed-tab
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply completed tab patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/scripts/add-team-payment-inbox-completed-tab.py ]; then
            python .github/scripts/add-team-payment-inbox-completed-tab.py
            rm .github/scripts/add-team-payment-inbox-completed-tab.py
          fi

      - name: Validate completed view
        shell: bash
        run: |
          set -euo pipefail
          grep -q "{ value: 'completed', label: 'مكتملة' }" src/components/business/PaymentInbox.tsx
          grep -q "grid-cols-3" src/components/business/PaymentInbox.tsx
          grep -q "العمليات التي أكملتها واعتمدتها" src/components/business/PaymentInbox.tsx
          npx tsc --noEmit
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add completed tab to team payment inbox"
            git pull --rebase origin feature/team-payment-inbox-completed-tab
            git push origin HEAD:feature/team-payment-inbox-completed-tab
          fi
