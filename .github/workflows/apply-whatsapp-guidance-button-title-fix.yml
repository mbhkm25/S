name: Apply WhatsApp guidance button title fix

on:
  push:
    branches:
      - fix/whatsapp-guidance-button-title
    paths:
      - scripts/fix-whatsapp-guidance-button-title.py
      - .github/workflows/apply-whatsapp-guidance-button-title-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-guidance-button-title
          fetch-depth: 0
      - name: Apply title fix
        run: python scripts/fix-whatsapp-guidance-button-title.py
      - name: Validate title length marker
        run: grep -q 'title: "تشغيل سند للنشاط"' supabase/functions/sanad-v3-whatsapp-intake/index.ts
      - name: Commit generated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/sanad-v3-whatsapp-intake/index.ts
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Fix WhatsApp guidance button title length'
            git push origin HEAD:fix/whatsapp-guidance-button-title
          fi
