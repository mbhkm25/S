name: Validate operation details v4

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-operation-details-v4.yml'
      - '.github/scripts/fix-preview-v5-types.py'
      - 'src/features/operations/OperationDetailsRuntimeV2.tsx'
      - 'supabase/functions/sanad-operation-preview-worker/**'

permissions:
  contents: write

jobs:
  validate-and-deploy-preview:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operation-details-v4-preview-actions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Apply preview type correction
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/scripts/fix-preview-v5-types.py ]; then
            python .github/scripts/fix-preview-v5-types.py
            rm .github/scripts/fix-preview-v5-types.py
          fi

      - name: Validate frontend and worker
        shell: bash
        run: |
          set -euo pipefail
          grep -q "p_source: 'operation_details'" src/features/operations/OperationDetailsRuntimeV2.tsx
          grep -q 'إجراءات العملية' src/features/operations/OperationDetailsRuntimeV2.tsx
          ! grep -q 'fixed inset-x-0 bottom-\[calc(68px' src/features/operations/OperationDetailsRuntimeV2.tsx
          grep -q 'content-crop-v5' supabase/functions/sanad-operation-preview-worker/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/sanad-operation-preview-worker/index.ts
          npx tsc --noEmit
          npm run build

      - name: Commit type correction
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fix preview v5 Deno types"
            git pull --rebase origin fix/operation-details-v4-preview-actions
            git push origin HEAD:fix/operation-details-v4-preview-actions
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy preview worker v5
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          supabase functions deploy sanad-operation-preview-worker \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
