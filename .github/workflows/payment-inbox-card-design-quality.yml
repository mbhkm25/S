name: Payment inbox card design quality

on:
  pull_request:
    paths:
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-cashier-ui.css'
      - 'public/payment-inbox-cashier-ui.js'
      - '.github/workflows/payment-inbox-card-design-quality.yml'
  push:
    branches: [main]
    paths:
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-cashier-ui.css'
      - 'public/payment-inbox-cashier-ui.js'
      - '.github/workflows/payment-inbox-card-design-quality.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check public/payment-inbox-cashier-ui.js

      - name: Validate single UI layer
        shell: bash
        run: |
          set -euo pipefail
          html='public/payment-inbox.html'
          grep -Fq '/payment-inbox-cashier-ui.css' "$html"
          grep -Fq '/payment-inbox-cashier-ui.js' "$html"
          ! grep -Fq '/payment-inbox-operational-ui.js' "$html"
          ! grep -Fq '/payment-inbox-card-v2.js' "$html"
          ! grep -Fq '/payment-inbox-cashier-layout.js' "$html"
          ! grep -Fq '/payment-inbox-cashier-runtime-fix.js' "$html"

      - name: Validate compact integrated header
        shell: bash
        run: |
          set -euo pipefail
          html='public/payment-inbox.html'
          css='public/payment-inbox-cashier-ui.css'
          grep -Fq 'hero-operations' "$html"
          grep -Fq 'hero-business' "$html"
          grep -Fq 'hero-tabs' "$html"
          grep -Fq 'height: 176px' "$css"
          grep -Fq 'grid-template-columns: minmax(200px, .72fr) minmax(0, 1.28fr)' "$css"
          grep -Fq 'overflow-x: auto' "$css"
          grep -Fq '#paymentInboxTabSwitcher' "$css"

      - name: Validate cashier actions and logos
        shell: bash
        run: |
          set -euo pipefail
          script='public/payment-inbox-cashier-ui.js'
          css='public/payment-inbox-cashier-ui.css'
          grep -Fq 'فتح الإشعار' "$script"
          grep -Fq 'استلام العملية' "$script"
          grep -Fq 'استلام وتحقق' "$script"
          grep -Fq 'فتح الملف الأصلي' "$script"
          grep -Fq 'waitForClaim' "$script"
          grep -Fq 'financial-logo' "$css"
          grep -Fq 'background: transparent' "$css"
          grep -Fq 'object-fit: contain' "$css"
          grep -Fq 'cashier-claim' "$css"
          grep -Fq 'cashier-verify' "$css"
          grep -Fq 'cashier-original' "$css"

      - name: Validate stable rendering and loading guard
        shell: bash
        run: |
          set -euo pipefail
          script='public/payment-inbox-cashier-ui.js'
          grep -Fq 'WeakSet' "$script"
          grep -Fq 'enhanced.has(card)' "$script"
          grep -Fq 'MutationObserver' "$script"
          grep -Fq 'subtree: false' "$script"
          grep -Fq 'installLoadingWatchdog' "$script"
          grep -Fq 'sanad:payment-inbox-v2-loaded' "$script"
          grep -Fq 'sanad:payment-inbox-loaded' "$script"

      - name: Validate mobile interaction quality
        shell: bash
        run: |
          set -euo pipefail
          css='public/payment-inbox-cashier-ui.css'
          grep -Fq 'min-height: 44px' "$css"
          grep -Fq '@media (max-width: 720px)' "$css"
          grep -Fq '@media (max-width: 440px)' "$css"
          grep -Fq '@media (min-width: 900px)' "$css"
          grep -Fq 'font-variant-numeric: tabular-nums' "$css"
