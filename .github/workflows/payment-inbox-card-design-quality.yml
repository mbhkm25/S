name: Payment inbox card design quality

on:
  pull_request:
    paths:
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-card-v2.css'
      - 'public/payment-inbox-card-v2-operational.css'
      - 'public/payment-inbox-card-v2.js'
      - 'public/payment-inbox-cashier-layout.css'
      - 'public/payment-inbox-cashier-fixes.css'
      - 'public/payment-inbox-cashier-layout.js'
      - '.github/workflows/payment-inbox-card-design-quality.yml'
  push:
    branches: [main]
    paths:
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-card-v2.css'
      - 'public/payment-inbox-card-v2-operational.css'
      - 'public/payment-inbox-card-v2.js'
      - 'public/payment-inbox-cashier-layout.css'
      - 'public/payment-inbox-cashier-fixes.css'
      - 'public/payment-inbox-cashier-layout.js'
      - '.github/workflows/payment-inbox-card-design-quality.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check public/payment-inbox-card-v2.js
          node --check public/payment-inbox-cashier-layout.js

      - name: Validate cashier-first structure
        shell: bash
        run: |
          set -euo pipefail
          script='public/payment-inbox-cashier-layout.js'
          css='public/payment-inbox-cashier-layout.css'
          fixes='public/payment-inbox-cashier-fixes.css'
          grep -Fq 'installHeaderLayout' "$script"
          grep -Fq 'hero-operations' "$script"
          grep -Fq 'paymentInboxCardV2Toolbar' "$script"
          grep -Fq 'cashier-claim' "$script"
          grep -Fq 'cashier-claim-verify' "$script"
          grep -Fq 'cashier-original' "$script"
          grep -Fq 'financial-logo' "$script"
          grep -Fq 'original_file_url' "$script"
          grep -Fq 'height: 220px' "$fixes"
          grep -Fq '#paymentInboxCardV2Toolbar' "$css"

      - name: Validate action hierarchy and icons
        shell: bash
        run: |
          set -euo pipefail
          script='public/payment-inbox-cashier-layout.js'
          css='public/payment-inbox-cashier-layout.css'
          grep -Fq 'فتح الإشعار' "$script"
          grep -Fq 'استلام العملية' "$script"
          grep -Fq 'استلام وتحقق' "$script"
          grep -Fq 'فتح الملف الأصلي' "$script"
          grep -Fq 'cashier-green' "$css"
          grep -Fq 'cashier-blue' "$css"
          grep -Fq 'cashier-purple' "$css"
          grep -Fq '<svg class="action-icon"' "$script"

      - name: Validate transparent logo presentation
        shell: bash
        run: |
          set -euo pipefail
          css='public/payment-inbox-cashier-layout.css'
          fixes='public/payment-inbox-cashier-fixes.css'
          grep -Fq 'background: transparent' "$css"
          grep -Fq 'border: 0' "$css"
          grep -Fq 'object-fit: contain' "$css"
          grep -Fq 'financial-logo-host' "$fixes"

      - name: Validate original card system remains compatible
        shell: bash
        run: |
          set -euo pipefail
          script='public/payment-inbox-card-v2.js'
          grep -Fq 'MutationObserver' "$script"
          grep -Fq 'sanad:payment-inbox-v2-loaded' "$script"
          grep -Fq 'card.dataset.status' "$script"
          grep -Fq 'aria-busy' "$script"

      - name: Validate load order
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/payment-inbox-card-v2.css' public/payment-inbox.html
          grep -Fq '/payment-inbox-cashier-layout.css' public/payment-inbox.html
          grep -Fq '/payment-inbox-cashier-fixes.css' public/payment-inbox.html
          grep -Fq '/payment-inbox-cashier-layout.js' public/payment-inbox.html
          test "$(grep -n '/payment-inbox-card-v2.js' public/payment-inbox.html | cut -d: -f1)" -lt "$(grep -n '/payment-inbox-cashier-layout.js' public/payment-inbox.html | cut -d: -f1)"
          grep -Fq 'aria-live="polite"' public/payment-inbox.html
