name: Payment inbox card design quality

on:
  pull_request:
    paths:
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/components/business/BusinessOperations.tsx'
      - 'src/features/operations/OperationDetailsActionIntent.tsx'
      - 'src/features/operations/OperationIdentityDetailsBanner.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'src/main.tsx'
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-admin.html'
      - '.github/workflows/payment-inbox-card-design-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/components/business/BusinessOperations.tsx'
      - 'src/features/operations/OperationDetailsActionIntent.tsx'
      - 'src/features/operations/OperationIdentityDetailsBanner.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'src/main.tsx'
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-admin.html'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Validate approved app shell integration
        shell: bash
        run: |
          set -euo pipefail
          component='src/components/business/PaymentInbox.tsx'
          api='src/lib/paymentInboxApi.ts'
          host='src/components/business/BusinessOperations.tsx'
          grep -Fq "view === 'payment-inbox'" "$host"
          grep -Fq "view === 'payment-inbox-admin'" "$host"
          grep -Fq 'space-y-4 font-arabic' "$component"
          ! grep -Fq 'bottom_nav' "$component"
          ! grep -Fq 'global_header' "$component"
          grep -Fq 'get_business_payment_inbox_v2' "$api"
          grep -Fq 'action_permissions' "$component"

      - name: Validate cashier-first and Pro-gated actions
        shell: bash
        run: |
          set -euo pipefail
          component='src/components/business/PaymentInbox.tsx'
          intent='src/features/operations/OperationDetailsActionIntent.tsx'
          api='src/lib/paymentInboxApi.ts'
          grep -Fq "{ value: 'new', label: 'جديدة' }" "$component"
          grep -Fq "{ value: 'mine', label: 'لدي' }" "$component"
          grep -Fq 'فتح السجل' "$component"
          grep -Fq 'استلام العملية' "$component"
          grep -Fq 'استلام وتحقق' "$component"
          grep -Fq 'فتح الملف الأصلي' "$component"
          grep -Fq 'getPaymentInboxProAccess' "$component"
          grep -Fq 'plan?.is_pro === true' "$api"
          grep -Fq "document.getElementById('btn_confirm_verify')" "$intent"
          grep -Fq "includes('فتح الملف الأصلي')" "$intent"
          grep -Fq 'claimPaymentInboxItem' "$intent"
          grep -Fq 'completePaymentInboxItem' "$intent"

      - name: Validate identity banner is inline
        shell: bash
        run: |
          set -euo pipefail
          banner='src/features/operations/OperationIdentityDetailsBanner.tsx'
          grep -Fq "document.getElementById('quick_summary_card')" "$banner"
          grep -Fq "summary.insertAdjacentElement('afterend', node)" "$banner"
          grep -Fq 'createPortal' "$banner"
          ! grep -Fq 'fixed inset-x' "$banner"

      - name: Validate supervisor separation and legacy redirects
        shell: bash
        run: |
          set -euo pipefail
          component='src/components/business/PaymentInbox.tsx'
          grep -Fq "{ value: 'team_active', label: 'لدى الفريق' }" "$component"
          grep -Fq "{ value: 'review', label: 'تحتاج مراجعة' }" "$component"
          grep -Fq 'إدارة وارد المدفوعات' "$component"
          grep -Fq "view', 'payment-inbox'" public/payment-inbox.html
          grep -Fq "view', 'payment-inbox-admin'" public/payment-inbox-admin.html
