name: Payment inbox workflow hardening quality

on:
  pull_request:
    paths:
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'src/features/operations/OperationDetailsActionIntent.tsx'
      - 'supabase/migrations/*payment_inbox*'
      - 'supabase/tests/payment_inbox_workflow_hardening.sql'
      - '.github/workflows/payment-inbox-workflow-hardening-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'src/features/operations/OperationDetailsActionIntent.tsx'
      - 'supabase/migrations/*payment_inbox*'
      - 'supabase/tests/payment_inbox_workflow_hardening.sql'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate V2 client contracts
        shell: bash
        run: |
          set -euo pipefail
          api='src/lib/paymentInboxApi.ts'
          intent='src/features/operations/OperationDetailsActionIntent.tsx'
          grep -Fq 'claim_business_payment_v2' "$api"
          grep -Fq 'complete_business_payment_v2' "$api"
          grep -Fq 'p_expected_row_version' "$api"
          grep -Fq 'claim_race_lost' "$api"
          grep -Fq 'stale_item' "$api"
          grep -Fq 'claimPaymentInboxItem' "$intent"
          grep -Fq 'completePaymentInboxItem' "$intent"
      - name: Validate concurrency and review contracts
        shell: bash
        run: |
          set -euo pipefail
          core='supabase/migrations/20260802171000_payment_inbox_workflow_hardening.sql'
          review='supabase/migrations/20260802171100_payment_inbox_review_state_and_context_fix.sql'
          assignees='supabase/migrations/20260802171200_payment_inbox_assignee_owner_support.sql'
          for file in "$core" "$review" "$assignees"; do test -s "$file"; done
          grep -Fq 'for update' "$core"
          grep -Fq 'row_version=row_version+1' "$core"
          grep -Fq "'claim_race_lost'" "$core"
          grep -Fq "'stale_action_rejected'" "$core"
          grep -Fq 'request_business_payment_review_v2' "$review"
          grep -Fq 'resume_business_payment_review_v2' "$review"
          grep -Fq 'get_business_payment_claim_assignees' "$assignees"
      - name: Validate transactional regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test_file='supabase/tests/payment_inbox_workflow_hardening.sql'
          test -s "$test_file"
          grep -Fq 'claim_race_lost' "$test_file"
          grep -Fq 'stale_item' "$test_file"
          grep -Fq "'qr_details'" "$test_file"
          grep -Fq 'review_resumed' "$test_file"
          grep -Fq 'rollback;' "$test_file"
