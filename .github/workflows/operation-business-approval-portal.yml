name: Wire operation business approval portal

on:
  push:
    branches:
      - fix/operation-business-link-portal-and-explicit-approval
    paths:
      - '.github/workflows/operation-business-approval-portal.yml'
      - '.github/scripts/wire-operation-business-approval-portal.py'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operation-business-link-portal-and-explicit-approval
          fetch-depth: 0

      - name: Apply portal wiring
        run: python .github/scripts/wire-operation-business-approval-portal.py

      - name: Commit completed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate operation business approval portal"
          git push origin HEAD:fix/operation-business-link-portal-and-explicit-approval
