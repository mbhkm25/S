name: Validate WhatsApp intake

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-whatsapp-intake.yml'
      - 'supabase/functions/sanad-v3-whatsapp-intake/**'
      - 'supabase/migrations/**instant_intake_event_pipeline**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-whatsapp-intake.yml'
      - 'supabase/functions/sanad-v3-whatsapp-intake/**'
      - 'supabase/migrations/**instant_intake_event_pipeline**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate WhatsApp intake
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'sanad-v3-analyze-operation' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          ! grep -q 'waitUntil' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          ! grep -q 'sanad-v3-whatsapp-onboarding' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          ! grep -q 'service_record_operation_pipeline_span' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -q 'claim_whatsapp_operation_intake' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -q 'finalize_whatsapp_operation_intake' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -q 'p_spans: params.spans' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -q 'sanad_show_operation:' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/sanad-v3-whatsapp-intake/index.ts
          deno test supabase/functions/sanad-v3-whatsapp-intake/intake-utils.test.ts
