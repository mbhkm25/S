name: Deploy WhatsApp intake

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-whatsapp-intake.yml'
      - 'scripts/apply-dynamic-financial-identifier-labels.py'
      - 'supabase/functions/sanad-v3-whatsapp-intake/**'
      - 'supabase/migrations/**whatsapp_sender_guidance**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply dynamic financial identifier labels
        run: python scripts/apply-dynamic-financial-identifier-labels.py

      - name: Persist generated source on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/operations/OperationDetailsRuntimeV2.tsx src/components/Details.tsx
          if git diff --cached --quiet; then
            echo 'No generated source changes'
          else
            git commit -m 'Use dynamic financial identifier labels in operation details'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate WhatsApp intake
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'whatsapp_sender_guidance_sent' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -q 'claim_operation_sender_guidance' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -q 'sanad_show_operation:' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/sanad-v3-whatsapp-intake/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Deploy WhatsApp intake preserving webhook authentication
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy sanad-v3-whatsapp-intake \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
