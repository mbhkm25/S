name: Deploy SANAD Local Extraction V2

on:
  push:
    branches:
      - feature/sanad-local-extraction-engine
    paths:
      - services/sanad-fast-analyzer/**
      - .github/workflows/deploy-local-extraction-v2.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref/commit to deploy
        required: true
        default: feature/sanad-local-extraction-engine

permissions:
  contents: read

concurrency:
  group: sanad-local-extraction-v2-server
  cancel-in-progress: false

env:
  DEPLOY_ROOT: /opt/sanad-local-extraction
  COMPOSE_PROJECT_NAME: sanad-local-extraction
  KEYINFO_URL: https://hudbzlgclghlhazlduas.supabase.co/functions/v1/sanad-ocr-bridge-keyinfo

jobs:
  deploy:
    name: Validate and deploy isolated V2 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Record candidate SHA
        id: meta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch derived public key
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 "$KEYINFO_URL" >/tmp/bridge-key.json
          python3 - <<'PY' >/tmp/bridge-public-key.txt
          import json
          p=json.load(open('/tmp/bridge-key.json'))
          assert p.get('ok') is True and p.get('scheme')=='ed25519-sha256-v1',p
          key=p.get('public_key_b64','')
          assert len(key)>=40,key
          print(key)
          PY
          echo "BRIDGE_PUBLIC_KEY_READY"

      - name: Validate source and descriptors
        working-directory: services/sanad-fast-analyzer
        env:
          SANAD_BRIDGE_PUBLIC_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -euo pipefail
          python -m py_compile ocr-runtime/app.py fast-ocr-runtime/app.py secure-ocr-bridge/app.py
          docker compose -f docker-compose.local.yml config >/dev/null
          docker build -f fast-ocr-runtime/Dockerfile fast-ocr-runtime
          docker build -f secure-ocr-bridge/Dockerfile secure-ocr-bridge
          docker build -f Dockerfile .

      - name: Build deployment archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='*.private.json' --exclude='local-extraction-benchmark-*.json' --exclude='amqi-benchmark-*.json' \
            -C services/sanad-fast-analyzer -czf /tmp/sanad-local-extraction-v2.tgz .

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SANAD_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SANAD_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Upload and activate immutable isolated release
        shell: bash
        env:
          HOST: ${{ secrets.SANAD_SERVER_HOST }}
          USER: ${{ secrets.SANAD_SERVER_USER }}
          PORT: ${{ secrets.SANAD_SERVER_PORT }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          bridge_public_key="$(cat /tmp/bridge-public-key.txt)"
          ssh -p "${PORT:-22}" "$USER@$HOST" 'set -e; test "$(id -un)" = sanad-deploy; docker ps >/dev/null; test -w /opt/sanad-local-extraction'
          ssh -p "${PORT:-22}" "$USER@$HOST" "mkdir -p '$DEPLOY_ROOT/releases/$RELEASE_SHA' '$DEPLOY_ROOT/shared'"
          cat /tmp/sanad-local-extraction-v2.tgz | ssh -p "${PORT:-22}" "$USER@$HOST" "tar -xzf - -C '$DEPLOY_ROOT/releases/$RELEASE_SHA'"
          printf 'SANAD_BRIDGE_PUBLIC_KEY_B64=%s\n' "$bridge_public_key" | ssh -p "${PORT:-22}" "$USER@$HOST" "cat > '$DEPLOY_ROOT/shared/bridge.env' && chmod 600 '$DEPLOY_ROOT/shared/bridge.env'"
          ssh -p "${PORT:-22}" "$USER@$HOST" \
            "DEPLOY_ROOT='$DEPLOY_ROOT' RELEASE_SHA='$RELEASE_SHA' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          release="$DEPLOY_ROOT/releases/$RELEASE_SHA"
          envfile="$DEPLOY_ROOT/shared/bridge.env"
          previous=""
          if [ -L "$DEPLOY_ROOT/current" ]; then previous="$(readlink -f "$DEPLOY_ROOT/current" || true)"; fi
          rollback(){
            echo 'V2 isolated deployment failed; rolling back' >&2
            docker logs --tail 120 sanad-secure-ocr-bridge 2>&1 || true
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              ln -sfn "$previous" "$DEPLOY_ROOT/current"
              cd "$previous"
              docker compose --env-file "$envfile" -p "$COMPOSE_PROJECT_NAME" -f docker-compose.local.yml up -d --build || true
            fi
          }
          trap rollback ERR
          cd "$release"
          docker compose --env-file "$envfile" -p "$COMPOSE_PROJECT_NAME" -f docker-compose.local.yml build sanad-fast-ocr sanad-secure-ocr-bridge sanad-local-ocr sanad-local-analyzer
          docker compose --env-file "$envfile" -p "$COMPOSE_PROJECT_NAME" -f docker-compose.local.yml up -d

          wait_ready(){
            url="$1"; name="$2"; tries="$3"; sleep_s="$4"; extra="${5:-}"
            for _ in $(seq 1 "$tries"); do
              if curl --fail --silent --max-time 3 $extra "$url" >/tmp/${name}-ready.json 2>/dev/null; then return 0; fi
              sleep "$sleep_s"
            done
            echo "$name failed readiness" >&2
            return 1
          }
          wait_ready http://127.0.0.1:8092/health/ready fast-ocr 40 2
          wait_ready https://127.0.0.1:8443/health/ready secure-bridge 40 2 "--insecure --noproxy '*'"
          wait_ready http://127.0.0.1:8091/health/ready paddle-ocr 144 5
          wait_ready http://127.0.0.1:8090/health/ready analyzer 60 2
          cat /tmp/fast-ocr-ready.json; echo
          cat /tmp/secure-bridge-ready.json; echo
          cat /tmp/paddle-ocr-ready.json; echo
          cat /tmp/analyzer-ready.json; echo

          unsigned_status="$(curl --silent --insecure --noproxy '*' --output /tmp/bridge-unsigned.json --write-out '%{http_code}' --max-time 10 -H 'content-type: image/png' --data-binary 'not-an-image' https://127.0.0.1:8443/v1/ocr || true)"
          test "$unsigned_status" = "401"

          ln -sfn "$release" "$DEPLOY_ROOT/current"
          printf '%s\n' "$RELEASE_SHA" > "$DEPLOY_ROOT/DEPLOYED_SHA"
          date -u +%FT%TZ > "$DEPLOY_ROOT/DEPLOYED_AT"
          trap - ERR
          cd "$DEPLOY_ROOT/releases"
          ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf --
          REMOTE

      - name: Verify deployed isolated runtime
        shell: bash
        env:
          HOST: ${{ secrets.SANAD_SERVER_HOST }}
          USER: ${{ secrets.SANAD_SERVER_USER }}
          PORT: ${{ secrets.SANAD_SERVER_PORT }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -p "${PORT:-22}" "$USER@$HOST" \
            "test \"\$(cat '$DEPLOY_ROOT/DEPLOYED_SHA')\" = '$RELEASE_SHA'; \
             curl --fail --silent http://127.0.0.1:8092/health/ready; echo; \
             curl --fail --silent --insecure --noproxy '*' https://127.0.0.1:8443/health/ready; echo; \
             curl --fail --silent http://127.0.0.1:8091/health/ready; echo; \
             curl --fail --silent http://127.0.0.1:8090/health/ready; echo; \
             cd '$DEPLOY_ROOT/current' && docker compose --env-file '$DEPLOY_ROOT/shared/bridge.env' -p '$COMPOSE_PROJECT_NAME' -f docker-compose.local.yml ps; \
             docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' sanad-fast-ocr sanad-secure-ocr-bridge sanad-local-ocr sanad-local-analyzer"

      - name: Verify public TLS bridge health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 https://sanadflow.com:8443/health/ready
          status="$(curl --silent --output /tmp/public-unsigned.json --write-out '%{http_code}' --max-time 10 -H 'content-type: image/png' --data-binary 'not-an-image' https://sanadflow.com:8443/v1/ocr || true)"
          test "$status" = "401"
