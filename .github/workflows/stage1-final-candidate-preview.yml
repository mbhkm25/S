name: Stage 1 Final Candidate Preview

on:
  push:
    branches:
      - ops/stage1-final-candidate-preview
    paths:
      - '.github/workflows/stage1-final-candidate-preview.yml'

permissions:
  contents: read

concurrency:
  group: stage1-final-candidate-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_SHA: 0fa409a1bf704b9c494bad51d909c85222c85d02
      PREVIEW_PORT: '4173'
      VOICE_CANDIDATE_URL: 'https://api.sanadflow.com/functions/v1/sanad-ai-transcribe-stage1e-candidate'

    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify integration SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate final Stage 1 candidate
        run: |
          npm run lint
          npm run check:routes
          npm run build
          npm run check:bundle-budget

      - name: Build final preview with test-gated Voice v2 endpoint
        env:
          VITE_APP_VERSION: stage1-final-0fa409a1bf704b9c494bad51d909c85222c85d02
          VITE_SANAD_VOICE_PREVIEW: 'true'
          VITE_SANAD_VOICE_ENDPOINT: /__stage1_voice_proxy
        run: |
          rm -rf dist
          npm run build
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/version.json

      - name: Prepare preview server
        shell: bash
        run: |
          cat > /tmp/sanad_stage1_final_preview.py <<'PY'
          import http.server
          import mimetypes
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          ROOT = (pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "dist").resolve()
          PORT = int(os.environ.get("PREVIEW_PORT", "4173"))
          VOICE_TARGET = os.environ["VOICE_CANDIDATE_URL"]

          class Handler(http.server.BaseHTTPRequestHandler):
              def send_body(self, body, content_type="text/plain; charset=utf-8", status=200):
                  self.send_response(status)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("Referrer-Policy", "no-referrer")
                  self.send_header("Cache-Control", "no-store" if self.path.startswith(("/sw.js", "/version.json")) else "no-cache")
                  self.end_headers()
                  if self.command != "HEAD":
                      self.wfile.write(body)

              def resolve(self):
                  parsed = urllib.parse.urlsplit(self.path)
                  rel = urllib.parse.unquote(parsed.path).lstrip("/")
                  candidate = (ROOT / rel).resolve()
                  if ROOT not in candidate.parents and candidate != ROOT:
                      return None
                  if candidate.is_dir():
                      candidate = candidate / "index.html"
                  return candidate if candidate.is_file() else ROOT / "index.html"

              def do_GET(self):
                  path = self.resolve()
                  if not path or not path.is_file():
                      self.send_error(404)
                      return
                  data = path.read_bytes()
                  ctype = mimetypes.guess_type(path.name)[0] or "application/octet-stream"
                  if ctype.startswith("text/") or path.suffix in {".js", ".json", ".webmanifest"}:
                      ctype += "; charset=utf-8"
                  self.send_body(data, ctype)

              def do_HEAD(self):
                  self.do_GET()

              def do_POST(self):
                  if urllib.parse.urlsplit(self.path).path != "/__stage1_voice_proxy":
                      self.send_error(404)
                      return
                  length = int(self.headers.get("Content-Length") or "0")
                  if length <= 0 or length > 8 * 1024 * 1024:
                      self.send_body(b'{"ok":false,"error":"invalid_request"}', "application/json; charset=utf-8", 400)
                      return
                  body = self.rfile.read(length)
                  headers = {}
                  for name in ("Authorization", "apikey", "Content-Type", "Accept"):
                      value = self.headers.get(name)
                      if value:
                          headers[name] = value
                  request = urllib.request.Request(VOICE_TARGET, data=body, headers=headers, method="POST")
                  try:
                      with urllib.request.urlopen(request, timeout=135) as response:
                          data = response.read()
                          status = response.getcode()
                          ctype = response.headers.get("Content-Type") or "application/json; charset=utf-8"
                  except urllib.error.HTTPError as error:
                      data = error.read()
                      status = error.code
                      ctype = error.headers.get("Content-Type") or "application/json; charset=utf-8"
                  except Exception:
                      data = b'{"ok":false,"error":"service_unavailable"}'
                      status = 503
                      ctype = "application/json; charset=utf-8"
                  self.send_body(data, ctype, status)

              def log_message(self, fmt, *args):
                  print("[stage1-final-preview] " + (fmt % args), flush=True)

          http.server.ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
          PY

      - name: Start HTTPS tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/sanad_stage1_final_preview.py >/tmp/stage1-final-http.log 2>&1 &
          echo $! >/tmp/stage1-final-http.pid

          for attempt in $(seq 1 30); do
            curl --fail --silent "http://127.0.0.1:$PREVIEW_PORT/version.json" >/dev/null && break
            sleep 1
          done

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:$PREVIEW_PORT" >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid

          PREVIEW_URL=""
          for attempt in $(seq 1 60); do
            PREVIEW_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [[ -n "$PREVIEW_URL" ]] && break
            sleep 1
          done
          [[ -n "$PREVIEW_URL" ]] || { cat /tmp/cloudflared.log; exit 1; }
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify preview resources and production-like state gating
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --location --max-time 10 "$PREVIEW_URL/version.json" >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          [[ "$READY" -eq 1 ]]
          for path in / /sanad-ai /manifest.webmanifest /sw.js /version.json; do
            curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_URL$path" >/dev/null
          done

      - name: Publish preview access
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.preview_url }}
        shell: bash
        run: |
          cat > /tmp/stage1-final-preview-access.txt <<EOF
          TARGET_SHA=$TARGET_SHA
          LOGIN_URL=$PREVIEW_URL/
          SANAD_AI_URL=$PREVIEW_URL/sanad-ai
          STATE_OVERRIDE_NEGATIVE_TEST=$PREVIEW_URL/sanad-ai?assistantState=thinking
          EOF
          cat /tmp/stage1-final-preview-access.txt

      - name: Upload access details
        uses: actions/upload-artifact@v4
        with:
          name: stage1-final-candidate-preview-access
          path: /tmp/stage1-final-preview-access.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Keep preview available
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.preview_url }}
        shell: bash
        run: |
          echo "Stage 1 Final Candidate Preview: $PREVIEW_URL"
          for minute in $(seq 1 100); do
            kill -0 "$(cat /tmp/stage1-final-http.pid)" 2>/dev/null || exit 1
            kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null || exit 1
            sleep 60
          done
