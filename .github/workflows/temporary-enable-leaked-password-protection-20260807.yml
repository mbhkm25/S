name: One-shot enable leaked password protection 2026-08-07

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-enable-leaked-password-protection-20260807.yml

permissions:
  contents: read

concurrency:
  group: supabase-production-auth-hardening
  cancel-in-progress: false

jobs:
  enable-leaked-password-protection:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove source is current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Validate management credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Enable leaked password protection
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          before="$(curl --fail-with-body --silent --show-error "$api" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -r '.password_hibp_enabled')"
          echo "password_hibp_enabled before: ${before}"
          curl --fail-with-body --silent --show-error --request PATCH "$api" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"password_hibp_enabled":true}' \
            | jq -e '.password_hibp_enabled == true' >/dev/null
          after="$(curl --fail-with-body --silent --show-error "$api" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -r '.password_hibp_enabled')"
          test "$after" = "true"
          echo "password_hibp_enabled after: true"
