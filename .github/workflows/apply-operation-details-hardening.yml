name: Apply operation details hardening

on:
  push:
    branches:
      - agent/operation-time-file-access-relationship-hardening
    paths:
      - scripts/apply-operation-details-hardening.mjs
      - .github/workflows/apply-operation-details-hardening.yml

permissions:
  contents: write

jobs:
  apply-details-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/operation-time-file-access-relationship-hardening
          fetch-depth: 0

      - name: Apply deterministic patch
        run: node scripts/apply-operation-details-hardening.mjs

      - name: Commit patched details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden operation temporal and original file UI"
          git push origin HEAD:agent/operation-time-file-access-relationship-hardening
