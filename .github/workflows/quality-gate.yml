name: Production quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-application:
    name: Application and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/push-worker/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Type-check application
        run: npm run lint

      - name: Validate application routes
        run: npm run check:routes

      - name: Check patch whitespace
        run: git diff --check

      - name: Build production PWA
        run: npm run build -- --mode production

      - name: Build Android assets
        run: npm run build:android

      - name: Validate production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/reset-password.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/version.json
          test -d dist/assets

      - name: Install push worker dependencies
        working-directory: services/push-worker
        run: npm ci

      - name: Type-check push worker
        working-directory: services/push-worker
        run: npm run lint

      - name: Test push worker
        working-directory: services/push-worker
        run: npm test

  validate-supabase:
    name: Supabase migrations and Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad = []
          for path in Path('supabase/migrations').glob('*.sql'):
              if not re.fullmatch(r'\d+_[A-Za-z0-9_-]+\.sql', path.name):
                  bad.append(path.name)
          if bad:
              raise SystemExit('Invalid migration filenames: ' + ', '.join(sorted(bad)))
          PY

      - name: Check migrations for merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' supabase/migrations; then
            echo 'Merge conflict markers found in migrations.' >&2
            exit 1
          fi

      - name: Check every Edge Function
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t functions < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name 'index.ts' | sort)
          if [ "${#functions[@]}" -eq 0 ]; then
            echo 'No Supabase Edge Functions found.' >&2
            exit 1
          fi

          printf 'Checking %s Edge Functions\n' "${#functions[@]}"
          failed=0
          for entrypoint in "${functions[@]}"; do
            log_file="$(mktemp)"
            if deno check --no-lock "${entrypoint}" >"${log_file}" 2>&1; then
              echo "PASS ${entrypoint}"
            else
              failed=1
              echo "::error file=${entrypoint}::Deno check failed"
              echo "===== DENO FAILURE: ${entrypoint} ====="
              tail -n 100 "${log_file}"
              echo "===== END FAILURE: ${entrypoint} ====="
            fi
            rm -f "${log_file}"
          done
          exit "${failed}"

      - name: Ensure deployed-function sources are tracked
        shell: bash
        run: |
          set -euo pipefail
          required=(
            sanad-v3-analyze-operation
            sanad-v3-whatsapp-intake
            sanad-v3-whatsapp-assistant
            sanad-v3-knowledge-ingest
            sanad-v3-website-knowledge-sync
            sanad-phone-verification
            sanad-v3-process-report
            sanad-v3-notify-verification
            sanad-pro-payment-verify
            sanad-v3-whatsapp-campaign-worker
            sanad-v3-whatsapp-onboarding
          )
          for fn in "${required[@]}"; do
            test -f "supabase/functions/${fn}/index.ts" || {
              echo "Missing tracked source for Edge Function: ${fn}" >&2
              exit 1
            }
          done
