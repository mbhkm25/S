name: Production quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-application:
    name: Application and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/push-worker/package-lock.json
      - name: Set up Android icon generator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Install application dependencies
        run: npm ci
      - name: Type-check application
        run: npm run lint
      - name: Validate application routes
        run: npm run check:routes
      - name: Check patch whitespace
        run: git diff --check
      - name: Build production PWA
        run: npm run build -- --mode production
      - name: Build Android assets
        run: npm run build:android
      - name: Validate production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/reset-password.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/version.json
          test -d dist/assets
      - name: Install push worker dependencies
        working-directory: services/push-worker
        run: npm ci
      - name: Type-check push worker
        working-directory: services/push-worker
        run: npm run lint
      - name: Test push worker
        working-directory: services/push-worker
        run: npm test

  validate-supabase:
    name: Supabase migrations and Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate SANAD Local Extraction engine
        working-directory: services/sanad-fast-analyzer
        run: |
          deno task check
          deno task test
      - name: Validate Local OCR runtime syntax and compose
        run: |
          python -m py_compile services/sanad-fast-analyzer/ocr-runtime/app.py
          docker compose -f services/sanad-fast-analyzer/docker-compose.local.yml config >/dev/null
      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad = [p.name for p in Path('supabase/migrations').glob('*.sql') if not re.fullmatch(r'\d+_[A-Za-z0-9_-]+\.sql', p.name)]
          if bad:
              raise SystemExit('Invalid migration filenames: ' + ', '.join(sorted(bad)))
          PY
      - name: Check migrations for merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' supabase/migrations; then
            echo 'Merge conflict markers found in migrations.' >&2
            exit 1
          fi
      - name: Verify canonical migration layout
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-supabase-baseline-cutover-layout.mjs
      - name: Audit migration history logic
        run: node --test scripts/audit-supabase-migration-history.test.mjs
      - name: Deno check WhatsApp Assistant v5
        id: assistant_deno
        shell: bash
        run: |
          set +e
          deno check --node-modules-dir=auto --no-lock supabase/functions/sanad-v3-whatsapp-assistant/index.ts > assistant-v5-deno.log 2>&1
          status=$?
          cat assistant-v5-deno.log
          exit "$status"
      - name: Upload Assistant v5 Deno diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-v5-deno-diagnostics
          path: assistant-v5-deno.log
          if-no-files-found: error
          retention-days: 3
      - name: Deno check website knowledge sync
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/sanad-v3-website-knowledge-sync/index.ts
      - name: Deno check knowledge file ingestion
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/sanad-v3-knowledge-ingest/index.ts
      - name: Deno check phone verification
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/sanad-phone-verification/index.ts
      - name: Deno check production operation analyzer
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/sanad-operation-analysis-primary/index.ts
      - name: Deno check operation analysis worker
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/sanad-operation-analysis-worker/index.ts
      - name: Audit legacy Edge Functions
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          critical='sanad-v3-whatsapp-assistant|sanad-v3-website-knowledge-sync|sanad-v3-knowledge-ingest|sanad-phone-verification|sanad-operation-analysis-primary|sanad-operation-analysis-worker'
          mapfile -t functions < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name 'index.ts' | sort | grep -Ev "/(${critical})/index.ts$")
          failed=0
          for entrypoint in "${functions[@]}"; do
            if deno check --node-modules-dir=auto --no-lock "${entrypoint}" >/tmp/deno-legacy.log 2>&1; then
              echo "PASS ${entrypoint}"
            else
              failed=$((failed+1))
              echo "WARN ${entrypoint}"
              tail -n 12 /tmp/deno-legacy.log
            fi
          done
          echo "Legacy functions requiring follow-up: ${failed}"
      - name: Ensure deployed-function sources are tracked
        shell: bash
        run: |
          set -euo pipefail
          required=(
            sanad-v3-analyze-operation
            sanad-v3-whatsapp-intake
            sanad-v3-whatsapp-assistant
            sanad-v3-knowledge-ingest
            sanad-v3-website-knowledge-sync
            sanad-phone-verification
            sanad-v3-process-report
            sanad-v3-notify-verification
            sanad-pro-payment-verify
            sanad-v3-whatsapp-campaign-worker
            sanad-v3-whatsapp-onboarding
            sanad-operation-analysis-primary
            sanad-operation-analysis-worker
            sanad-operation-analysis-shadow
            sanad-operation-preview-worker
          )
          for fn in "${required[@]}"; do
            test -f "supabase/functions/${fn}/index.ts" || {
              echo "Missing tracked source for Edge Function: ${fn}" >&2
              exit 1
            }
          done
