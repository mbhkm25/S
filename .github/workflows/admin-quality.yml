name: SANAD Admin Quality Gate

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'src/components/admin/**'
      - 'src/lib/platformAdminApi.ts'
      - 'src/lib/adminCampaignApi.ts'
      - 'src/lib/supabase.ts'
      - 'src/lib/urlUtils.ts'
      - 'src/index.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanad-admin-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-admin:
    name: Validate independent admin app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build admin application
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: admin-quality-gate-placeholder
          VITE_PLATFORM_ADMIN_URL: https://admin.sanadflow.com
          VITE_PUBLIC_APP_URL: https://app.sanadflow.com
        run: npm run build:admin

      - name: Verify admin artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-admin/index.html
          test -d dist-admin/assets
          grep -q 'إدارة سند' dist-admin/index.html
