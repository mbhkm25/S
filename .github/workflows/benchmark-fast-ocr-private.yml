name: Benchmark SANAD Fast OCR Private Corpus

on:
  push:
    branches:
      - feature/sanad-local-extraction-engine
    paths:
      - services/sanad-fast-analyzer/fast-ocr-runtime/**
      - .github/workflows/benchmark-fast-ocr-private.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SANAD_SEMANTIC_LAB_REVISION: v3

concurrency:
  group: sanad-fast-ocr-private-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SANAD_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SANAD_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Acquire short-lived GitHub OIDC credential
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sanad-ocr-lab")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "SANAD_GITHUB_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Build isolated fast OCR on SANAD server
        shell: bash
        env:
          HOST: ${{ secrets.SANAD_SERVER_HOST }}
          USER: ${{ secrets.SANAD_SERVER_USER }}
          PORT: ${{ secrets.SANAD_SERVER_PORT }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tar -C services/sanad-fast-analyzer/fast-ocr-runtime -czf /tmp/sanad-fast-ocr.tgz .
          ssh -p "${PORT:-22}" "$USER@$HOST" "mkdir -p '/opt/sanad-local-extraction/experiments/fast-ocr/$SHA'"
          cat /tmp/sanad-fast-ocr.tgz | ssh -p "${PORT:-22}" "$USER@$HOST" \
            "tar -xzf - -C '/opt/sanad-local-extraction/experiments/fast-ocr/$SHA'"
          ssh -p "${PORT:-22}" "$USER@$HOST" "cd '/opt/sanad-local-extraction/experiments/fast-ocr/$SHA' && docker build -t 'sanad-fast-ocr:$SHA' ."

      - name: Run private corpus benchmark
        shell: bash
        env:
          HOST: ${{ secrets.SANAD_SERVER_HOST }}
          USER: ${{ secrets.SANAD_SERVER_USER }}
          PORT: ${{ secrets.SANAD_SERVER_PORT }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          OIDC_TOKEN: ${{ env.SANAD_GITHUB_OIDC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OIDC_TOKEN"
          ssh -p "${PORT:-22}" "$USER@$HOST" \
            "SHA='$SHA' RUN_ID='$RUN_ID' OIDC_TOKEN='$OIDC_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          name="sanad-fast-ocr-${RUN_ID}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          docker run -d --name "$name" \
            --memory=768m --cpus=4 \
            -p 127.0.0.1::8092 \
            -e SANAD_FAST_OCR_CONCURRENCY=1 \
            -e SANAD_FAST_OCR_TIMEOUT_SECONDS=8 \
            -e SANAD_FAST_OCR_MAX_IMAGE_LONG_SIDE=1600 \
            -e SANAD_FAST_OCR_PDF_DPI=150 \
            "sanad-fast-ocr:$SHA" >/dev/null
          host_port="$(docker port "$name" 8092/tcp | sed -E 's/.*:([0-9]+)$/\1/' | head -n1)"
          test -n "$host_port"
          base_url="http://127.0.0.1:${host_port}"
          ok=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "$base_url/health/ready" >/tmp/fast-ocr-ready.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" -eq 1
          cat /tmp/fast-ocr-ready.json
          docker inspect sanad-local-analyzer >/dev/null

          FAST_OCR_URL="$base_url" OIDC_TOKEN="$OIDC_TOKEN" RUN_ID="$RUN_ID" python3 - <<'PY'
          import json, mimetypes, os, pathlib, statistics, subprocess, time, urllib.request, urllib.error
          from collections import Counter

          corpus=pathlib.Path('/opt/sanad-local-extraction/shared/private-corpus/pilot-01')
          base=os.environ['FAST_OCR_URL']
          oidc=os.environ['OIDC_TOKEN']
          run_id=os.environ['RUN_ID']
          semantic_url='https://hudbzlgclghlhazlduas.supabase.co/functions/v1/sanad-ocr-gemini-lab-v2'
          allowed={'.jpg','.jpeg','.png','.webp','.pdf'}
          files=sorted(p for p in corpus.iterdir() if p.is_file() and p.suffix.lower() in allowed)
          parser_code='''import { parseWithRegistry } from "/app/src/local-extraction/parser-registry.ts"; const t=await new Response(Deno.stdin.readable).text(); const r=parseWithRegistry(t); const e=r.extraction; console.log(JSON.stringify({parser:r.parser,matched:r.matched,confidence:r.confidence,reasons:r.reasons,critical:{entity:!!e?.financialEntityCode,amount:Number.isFinite(e?.amount),currency:!!e?.currency,reference:!!(e?.documentReference||e?.transferReference),datetime:!!e?.transactionDatetime},review:!!e?.reviewRequired,parties:Array.isArray(e?.parties)?e.parties.length:0,identifiers:Array.isArray(e?.parties)?e.parties.reduce((n,p)=>n+(Array.isArray(p.identifiers)?p.identifiers.length:0),0):0}));'''
          rows=[]
          for i,p in enumerate(files,1):
              mime=mimetypes.guess_type(p.name)[0] or ('application/pdf' if p.suffix.lower()=='.pdf' else 'application/octet-stream')
              req=urllib.request.Request(base+'/v1/ocr',data=p.read_bytes(),method='POST',headers={'Content-Type':mime})
              st=time.perf_counter(); http=None; payload=None; error=None
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      http=r.status; payload=json.loads(r.read())
              except urllib.error.HTTPError as e:
                  http=e.code
                  try: payload=json.loads(e.read())
                  except Exception: error='http_error'
              except Exception as e:
                  error=type(e).__name__
              wall=round((time.perf_counter()-st)*1000,1)
              d=payload if isinstance(payload,dict) else {}
              raw=str(d.get('raw_text') or '')
              parser={}
              if http==200 and raw:
                  try:
                      pr=subprocess.run(['docker','exec','-i','sanad-local-analyzer','deno','eval','--no-lock',parser_code],input=raw,text=True,capture_output=True,timeout=5,check=True)
                      parser=json.loads(pr.stdout.strip().splitlines()[-1])
                  except Exception as e:
                      parser={'parser_error':type(e).__name__}
              critical=parser.get('critical') if isinstance(parser.get('critical'),dict) else {}
              complete=all(bool(critical.get(k)) for k in ('entity','amount','currency','reference'))

              semantic={}
              if http==200 and raw:
                  body=json.dumps({
                      'source_label':f'fast-ocr-{run_id}-case-{i}',
                      'ocr_provider':d.get('provider'),
                      'ocr_duration_ms':d.get('duration_ms'),
                      'ocr_confidence':d.get('confidence'),
                      'ocr_text':raw,
                  },ensure_ascii=False).encode('utf-8')
                  sreq=urllib.request.Request(semantic_url,data=body,method='POST',headers={
                      'Content-Type':'application/json',
                      'Authorization':'Bearer '+oidc,
                  })
                  sst=time.perf_counter()
                  try:
                      with urllib.request.urlopen(sreq,timeout=12) as sr:
                          semantic=json.loads(sr.read())
                  except urllib.error.HTTPError as e:
                      semantic={'ok':False,'http':e.code}
                  except Exception as e:
                      semantic={'ok':False,'error':type(e).__name__}
                  semantic['wall_ms']=round((time.perf_counter()-sst)*1000,1)

              row={
                  'case':i,'kind':p.suffix.lower(),'http':http,'wall_ms':wall,'error':error,
                  'ocr_ms':d.get('duration_ms'),'ocr_confidence':d.get('confidence'),
                  'chars':len(raw),'blocks':len(d.get('blocks') or []),
                  'parser':parser.get('parser'),'matched':parser.get('matched'),
                  'parser_confidence':parser.get('confidence'),'critical_complete':complete,
                  'review':parser.get('review'),'parties':parser.get('parties'),'identifiers':parser.get('identifiers'),
                  'parser_reasons':parser.get('reasons') or [],
                  'gemini_ok':semantic.get('ok'),
                  'gemini_ms':semantic.get('gemini_latency_ms'),
                  'pipeline_ms':semantic.get('total_pipeline_ms'),
                  'gemini_cost_usd':semantic.get('estimated_gemini_cost_usd'),
                  'prompt_tokens':(semantic.get('usage') or {}).get('prompt_tokens') if isinstance(semantic.get('usage'),dict) else None,
                  'candidate_tokens':(semantic.get('usage') or {}).get('candidate_tokens') if isinstance(semantic.get('usage'),dict) else None,
              }
              rows.append(row); print('FAST_CASE='+json.dumps(row,separators=(',',':'),ensure_ascii=True))

          okrows=[r for r in rows if r['http']==200]
          walls=[r['wall_ms'] for r in okrows]
          ocr=[float(r['ocr_ms']) for r in okrows if isinstance(r['ocr_ms'],(int,float))]
          gemini=[float(r['gemini_ms']) for r in rows if isinstance(r['gemini_ms'],(int,float))]
          pipeline=[float(r['pipeline_ms']) for r in rows if isinstance(r['pipeline_ms'],(int,float))]
          costs=[float(r['gemini_cost_usd']) for r in rows if isinstance(r['gemini_cost_usd'],(int,float))]
          def pct(xs,q):
              if not xs:return None
              xs=sorted(xs); return round(xs[max(0,min(len(xs)-1,int((len(xs)-1)*q)))],1)
          summary={
              'cases':len(rows),'http_200':len(okrows),'failed':len(rows)-len(okrows),
              'mean_wall_ms':round(statistics.fmean(walls),1) if walls else None,
              'p50_wall_ms':pct(walls,.5),'p95_wall_ms':pct(walls,.95),
              'mean_ocr_ms':round(statistics.fmean(ocr),1) if ocr else None,
              'p50_ocr_ms':pct(ocr,.5),'p95_ocr_ms':pct(ocr,.95),
              'mean_chars':round(statistics.fmean([r['chars'] for r in okrows]),1) if okrows else 0,
              'zero_text':sum(r['chars']==0 for r in okrows),
              'parser_matches':sum(bool(r['matched']) for r in rows),
              'critical_complete':sum(bool(r['critical_complete']) for r in rows),
              'parsers':dict(Counter(str(r['parser']) for r in rows)),
              'gemini_success':sum(r['gemini_ok'] is True for r in rows),
              'mean_gemini_ms':round(statistics.fmean(gemini),1) if gemini else None,
              'p95_gemini_ms':pct(gemini,.95),
              'mean_pipeline_ms':round(statistics.fmean(pipeline),1) if pipeline else None,
              'p95_pipeline_ms':pct(pipeline,.95),
              'total_gemini_cost_usd':round(sum(costs),8),
              'mean_gemini_cost_usd':round(statistics.fmean(costs),8) if costs else None,
              'errors':dict(Counter(str(r['error']) for r in rows if r['error'])),
          }
          print('FAST_SUMMARY='+json.dumps(summary,separators=(',',':'),sort_keys=True))
          PY
          echo 'FAST_RUNTIME_STATE'
          docker stats --no-stream "$name" --format 'cpu={{.CPUPerc}} mem={{.MemUsage}}'
          REMOTE
