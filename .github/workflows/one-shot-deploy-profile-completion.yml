name: One-shot deploy profile completion fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-deploy-profile-completion.yml'

permissions:
  contents: read

concurrency:
  group: sanad-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and route checks
        run: |
          npm run lint
          npm run check:routes

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to app.sanadflow.com
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://app.sanadflow.com
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          [[ -n "$SSH_KNOWN_HOSTS" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run guarded server deployment
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$HOST" ]]
          [[ -n "$DEPLOY_USER" ]]
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "sudo /usr/local/sbin/sanad-deploy-production '$RELEASE_SHA'"

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error --location --max-time 30 https://app.sanadflow.com/ >/dev/null && exit 0
            sleep 5
          done
          exit 1
