name: Probe SANAD Push Worker Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-worker-fcm-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect production deploy script safely
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== deploy-production.sh ==='
          if [ -r /opt/sanad-app/scripts/deploy-production.sh ]; then
            cat /opt/sanad-app/scripts/deploy-production.sh
          else
            echo 'deploy-script-not-readable'
          fi
          echo '=== /opt/sanad-app/scripts listing ==='
          find /opt/sanad-app/scripts -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true
          echo '=== repository remotes/branch only ==='
          if [ -d /opt/sanad-app/.git ]; then
            git -C /opt/sanad-app remote -v 2>/dev/null | sed -E 's#(https://)[^/@]+@#\1***@#g' || true
            git -C /opt/sanad-app branch --show-current 2>/dev/null || true
            git -C /opt/sanad-app rev-parse HEAD 2>/dev/null || true
          fi
          exit 0
          REMOTE
