name: Probe SANAD Push Worker Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-worker-fcm-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe runtime access without printing secrets
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== identity ==='
          id
          echo '=== sudo policy ==='
          sudo -n -l 2>&1 || true
          echo '=== docker direct access ==='
          if command -v docker >/dev/null 2>&1; then
            docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' 2>&1 | head -n 80 || true
          else
            echo 'docker-not-found'
          fi
          echo '=== readable roots ==='
          for d in /opt /srv /var/www /home; do
            if [ -d "$d" ]; then
              echo "-- $d"
              ls -la "$d" 2>&1 | head -n 60 || true
            fi
          done
          echo '=== systemd candidates ==='
          systemctl list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'push|sanad' || true
          echo '=== deploy helper ==='
          ls -l /usr/local/sbin/sanad-deploy-production 2>&1 || true
          echo '=== readable candidate paths ==='
          find /opt /srv /var/www -maxdepth 4 -type f \( -iname '*push*worker*' -o -iname 'docker-compose*.yml' -o -iname 'compose*.yml' -o -iname 'compose*.yaml' -o -iname '*.env' \) -print 2>/dev/null | sort | head -n 120 || true
          exit 0
          REMOTE
