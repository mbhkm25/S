name: Probe SANAD Push Worker Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-worker-fcm-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Locate live push worker without exposing secrets
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== process candidates ==='
          ps -eo user,pid,ppid,lstart,args --width 240 | grep -Ei 'push-worker|dist/index\.js|node .*3002|sanad.*push' | grep -v grep | head -n 80 || true
          echo '=== port 3002 listeners ==='
          ss -ltnp 2>/dev/null | grep -E '[:.]3002([[:space:]]|$)' || true
          echo '=== user timers/cron names ==='
          systemctl --user list-units --all --no-pager 2>/dev/null | grep -Ei 'push|sanad' || true
          crontab -l 2>/dev/null | sed -E 's/(=.*)/=*** /' || true
          echo '=== pwa lab compose structure ==='
          if [ -r /srv/sanad-pwa-lab/docker-compose.yml ]; then
            grep -nE '^[[:space:]]{2}[A-Za-z0-9_-]+:|^[[:space:]]+(image|build|env_file|container_name|restart|ports|volumes|command):|push|worker|3002' /srv/sanad-pwa-lab/docker-compose.yml | head -n 220 || true
          else
            echo 'pwa-lab-compose-not-readable'
          fi
          echo '=== readable push-worker paths ==='
          find /opt /srv /home -maxdepth 6 -type d -iname '*push*worker*' -print 2>/dev/null | sort | head -n 100 || true
          find /opt /srv /home -maxdepth 6 -type f \( -iname '*push*worker*' -o -path '*/push-worker/package.json' \) -print 2>/dev/null | sort | head -n 100 || true
          exit 0
          REMOTE
