name: Probe SANAD Push Worker Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-worker-fcm-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect allowed production deploy path safely
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== deploy helper content ==='
          cat /usr/local/sbin/sanad-deploy-production 2>&1 || true
          echo '=== sanitized /opt/sanad/docker-compose.yml structure ==='
          if [ -r /opt/sanad/docker-compose.yml ]; then
            grep -nE '^[[:space:]]{2}[A-Za-z0-9_-]+:|^[[:space:]]+(image|build|env_file|container_name|restart|ports|volumes):|push|worker' /opt/sanad/docker-compose.yml | head -n 220 || true
          else
            echo 'compose-not-readable'
          fi
          echo '=== /opt/sanad top-level structure ==='
          find /opt/sanad -maxdepth 2 -mindepth 1 -type d -print 2>/dev/null | sort | head -n 100 || true
          exit 0
          REMOTE
