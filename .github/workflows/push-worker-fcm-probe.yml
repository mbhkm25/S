name: Rollout SANAD Push Worker FCM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-worker-fcm-probe.yml'
      - 'services/push-worker/**'
      - 'scripts/deploy-push-worker.sh'
      - 'scripts/deploy-production.sh'

permissions:
  contents: read

concurrency:
  group: sanad-push-worker-fcm-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Validate Firebase service-account secret without exposing it
        shell: bash
        env:
          SERVICE_ACCOUNT_B64: ${{ secrets.SANAD_FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$SERVICE_ACCOUNT_B64" ]]
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          printf '%s' "$SERVICE_ACCOUNT_B64" | base64 --decode > "$tmp"
          node - "$tmp" <<'NODE'
          const fs = require('node:fs');
          const p = process.argv[2];
          let j;
          try { j = JSON.parse(fs.readFileSync(p, 'utf8')); } catch { process.exit(10); }
          if (j?.type !== 'service_account') process.exit(11);
          if (j?.project_id !== 'sanad-prod-1786344160') process.exit(12);
          if (j?.client_email !== 'fcm-sender@sanad-prod-1786344160.iam.gserviceaccount.com') process.exit(13);
          if (typeof j?.private_key !== 'string' || !j.private_key.includes('-----BEGIN PRIVATE KEY-----') || !j.private_key.includes('-----END PRIVATE KEY-----')) process.exit(14);
          NODE

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage Firebase credentials securely on production host
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          SERVICE_ACCOUNT_B64: ${{ secrets.SANAD_FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          printf '%s' "$SERVICE_ACCOUNT_B64" | ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            'umask 077; mkdir -p "$HOME/.sanad-deploy-staging"; chmod 700 "$HOME/.sanad-deploy-staging"; cat > "$HOME/.sanad-deploy-staging/firebase-service-account.json.b64"; chmod 600 "$HOME/.sanad-deploy-staging/firebase-service-account.json.b64"'

      - name: Bootstrap updated production deploy script
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "sudo /usr/local/sbin/sanad-deploy-production '$RELEASE_SHA'"

      - name: Execute FCM push-worker rollout through approved root deploy path
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "sudo /usr/local/sbin/sanad-deploy-production '$RELEASE_SHA'"

      - name: Verify live worker process exists after rollout
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "ps -eo args --width 240 | grep -E 'node dist/index\\.js' | grep -v grep >/dev/null"
