name: Probe SANAD Push Worker Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-worker-fcm-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe push-worker runtime without printing secrets
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== docker candidates ==='
          if command -v docker >/dev/null 2>&1; then
            sudo docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' | grep -Ei 'push|sanad' || true
            for c in $(sudo docker ps -a --format '{{.Names}}' | grep -Ei 'push|worker' || true); do
              echo "=== compose labels for $c ==="
              sudo docker inspect -f 'working_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}} config_files={{index .Config.Labels "com.docker.compose.project.config_files"}} service={{index .Config.Labels "com.docker.compose.service"}}' "$c" || true
            done
          fi
          echo '=== systemd candidates ==='
          systemctl list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'push|sanad' || true
          echo '=== candidate files ==='
          sudo find /opt /srv /etc -maxdepth 4 -type f \( -iname '*push*worker*' -o -iname 'docker-compose*.yml' -o -iname 'compose*.yml' -o -iname 'compose*.yaml' \) -print 2>/dev/null | sort | head -n 120
          REMOTE
