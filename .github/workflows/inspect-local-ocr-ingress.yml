name: Inspect SANAD Local OCR Ingress

on:
  push:
    branches:
      - feature/sanad-local-extraction-engine
    paths:
      - .github/workflows/inspect-local-ocr-ingress.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SANAD_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SANAD_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Inspect safe integration prerequisites
        env:
          HOST: ${{ secrets.SANAD_SERVER_HOST }}
          USER: ${{ secrets.SANAD_SERVER_USER }}
          PORT: ${{ secrets.SANAD_SERVER_PORT }}
        run: |
          set -euo pipefail
          ssh -p "${PORT:-22}" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '===IDENTITY==='; id
          echo '===LOCAL_HEALTH==='; curl --fail --silent --max-time 3 http://127.0.0.1:8092/health/ready || true; echo; curl --fail --silent --max-time 3 http://127.0.0.1:8091/health/ready || true; echo; curl --fail --silent --max-time 3 http://127.0.0.1:8090/health/ready || true; echo
          echo '===INTERNAL_KEY_PREREQUISITE===' 
          found=no
          for f in /opt/sanad/.env /opt/sanad/.env.production /opt/sanad/docker-compose.yml /opt/sanad/docker-compose.yaml; do
            if [ -r "$f" ] && grep -qE '^[[:space:]]*SANAD_INTERNAL_API_KEY=' "$f" 2>/dev/null; then found=yes; break; fi
          done
          echo "READABLE_INTERNAL_KEY_PRESENT=$found"
          echo '===PUBLIC_8443===' 
          curl --fail --silent --show-error --max-time 5 https://sanadflow.com:8443/health/ready || true; echo
          REMOTE
