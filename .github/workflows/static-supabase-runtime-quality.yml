name: Static Supabase runtime quality

on:
  pull_request:
    paths:
      - 'public/sanad-supabase-runtime.js'
      - 'public/routing-rollout.html'
      - 'public/payment-inbox.html'
      - 'src/lib/supabase.ts'
      - '.github/workflows/static-supabase-runtime-quality.yml'
  push:
    branches: [main]
    paths:
      - 'public/sanad-supabase-runtime.js'
      - 'public/routing-rollout.html'
      - 'public/payment-inbox.html'
      - 'src/lib/supabase.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static runtime syntax
        run: node --check public/sanad-supabase-runtime.js
      - name: Validate canonical public runtime key
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('public/sanad-supabase-runtime.js', 'utf8');
          const ref = source.match(/const PROJECT_REF = '([^']+)'/)?.[1];
          const token = source.match(/const ANON_KEY = '([^']+)'/)?.[1];
          if (!ref || !token) throw new Error('missing runtime project ref or anon key');
          const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
          if (payload.ref !== ref || payload.role !== 'anon') throw new Error('invalid public runtime key');
          NODE
          grep -Fq "headers.set('apikey', ANON_KEY)" public/sanad-supabase-runtime.js
          grep -Fq "parsed.searchParams.set('apikey', ANON_KEY)" public/sanad-supabase-runtime.js
      - name: Validate static and React runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<script src="/sanad-supabase-runtime.js"></script>' public/routing-rollout.html
          grep -Fq '/business/manage/operations' public/payment-inbox.html
          test -s src/lib/supabase.ts
