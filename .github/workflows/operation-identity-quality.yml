name: Operation identity quality

on:
  pull_request:
    paths:
      - 'src/lib/digits.ts'
      - 'src/lib/operationIdentity.ts'
      - 'src/features/operations/OperationIdentityDetailsBanner.tsx'
      - 'src/components/business/PaymentInbox.tsx'
      - 'supabase/migrations/*operation_identity*'
      - 'supabase/tests/operation_identity_projection.sql'
      - 'docs/operation-identity-investigation-bahkam.md'
      - '.github/workflows/operation-identity-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/digits.ts'
      - 'src/lib/operationIdentity.ts'
      - 'src/features/operations/OperationIdentityDetailsBanner.tsx'
      - 'src/components/business/PaymentInbox.tsx'
      - 'supabase/migrations/*operation_identity*'
      - 'supabase/tests/operation_identity_projection.sql'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate identity precedence and separation
        shell: bash
        run: |
          set -euo pipefail
          projection='supabase/migrations/20260802213000_operation_identity_projection.sql'
          feed='supabase/migrations/20260802220500_operation_identity_feed_contracts.sql'
          for file in "$projection" "$feed"; do test -s "$file"; done
          grep -Fq "when linked.business_id is not null then 'linked_business'" "$projection"
          grep -Fq "then 'exact_identifier_match'" "$projection"
          grep -Fq "else 'document_extraction'" "$projection"
          grep -Fq "'raw_receiver_name'" "$projection"
          grep -Fq "'resolved_business_name'" "$projection"
          grep -Fq "'resolved_account_holder_name'" "$projection"
          grep -Fq 'get_operation_identity_by_token' "$feed"
      - name: Validate React identity presentation
        shell: bash
        run: |
          set -euo pipefail
          banner='src/features/operations/OperationIdentityDetailsBanner.tsx'
          inbox='src/components/business/PaymentInbox.tsx'
          grep -Fq "document.getElementById('quick_summary_card')" "$banner"
          grep -Fq "summary.insertAdjacentElement('afterend', node)" "$banner"
          grep -Fq 'createPortal' "$banner"
          grep -Fq 'الاسم المستخرج من الإشعار' "$banner"
          grep -Fq 'resolved_business_name' "$inbox"
          grep -Fq 'account_holder_name' "$inbox"
      - name: Validate regression fixtures and numeral standards
        shell: bash
        run: |
          set -euo pipefail
          test_file='supabase/tests/operation_identity_projection.sql'
          test -s "$test_file"
          grep -Fq 'حاكم للعسل' "$test_file"
          grep -Fq 'باحكم للعسل' "$test_file"
          grep -Fq '825121' "$test_file"
          grep -Fq 'rollback;' "$test_file"
          grep -Fq 'toLatinDigits' src/lib/digits.ts
          grep -Fq "identitySource === 'linked_business'" src/lib/digits.ts
