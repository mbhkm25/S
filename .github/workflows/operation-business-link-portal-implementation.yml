name: Wire operation business link portal

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/scripts/wire-operation-portal.py'

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.base.ref == 'feature/operation-business-link-portal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operation-business-link-portal
          fetch-depth: 0

      - name: Apply portal wiring
        run: python .github/scripts/wire-operation-portal.py

      - name: Commit completed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Wire operation business linking through a body portal"
          git push origin HEAD:feature/operation-business-link-portal
