name: Stage 1G HF Preview

on:
  push:
    branches:
      - ops/stage1g-hf-preview
    paths:
      - '.github/workflows/stage1g-hf-preview.yml'

permissions:
  contents: read

concurrency:
  group: stage1g-hf-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_SHA: 'a7916638d466ba590809fbe3d5ab687a978cd790'
      PREVIEW_PORT: '4173'
      VOICE_CANDIDATE_URL: 'https://hudbzlgclghlhazlduas.supabase.co/functions/v1/sanad-ai-transcribe-stage1g-hf-candidate'

    steps:
      - name: Checkout exact hotfix candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify candidate and build
        shell: bash
        env:
          VITE_APP_VERSION: stage1g-hf-a7916638d466ba590809fbe3d5ab687a978cd790
          VITE_SANAD_VOICE_PREVIEW: 'true'
          VITE_SANAD_VOICE_ENDPOINT: ${{ env.VOICE_CANDIDATE_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          npm ci
          npm run lint
          npm run check:routes
          npm run build
          npm run check:bundle-budget
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/version.json

      - name: Prepare SPA server
        shell: bash
        run: |
          cat > /tmp/stage1g_hf_preview.py <<'PY'
          import http.server, mimetypes, os, pathlib, urllib.parse
          ROOT=(pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"dist").resolve()
          PORT=int(os.environ.get("PREVIEW_PORT","4173"))
          class Handler(http.server.BaseHTTPRequestHandler):
              def send_body(self, body, content_type="text/plain; charset=utf-8", status=200):
                  self.send_response(status)
                  self.send_header("Content-Type",content_type)
                  self.send_header("Content-Length",str(len(body)))
                  self.send_header("X-Content-Type-Options","nosniff")
                  self.send_header("Referrer-Policy","no-referrer")
                  self.send_header("Cache-Control","no-store" if self.path.startswith(("/sw.js","/version.json")) else "no-cache")
                  self.end_headers()
                  if self.command!="HEAD": self.wfile.write(body)
              def resolve(self):
                  rel=urllib.parse.unquote(urllib.parse.urlsplit(self.path).path).lstrip("/")
                  candidate=(ROOT/rel).resolve()
                  if ROOT not in candidate.parents and candidate!=ROOT: return None
                  if candidate.is_dir(): candidate=candidate/"index.html"
                  return candidate if candidate.is_file() else ROOT/"index.html"
              def do_GET(self):
                  path=self.resolve()
                  if not path or not path.is_file(): self.send_error(404); return
                  data=path.read_bytes()
                  ctype=mimetypes.guess_type(path.name)[0] or "application/octet-stream"
                  if ctype.startswith("text/") or path.suffix in {".js",".json",".webmanifest"}: ctype += "; charset=utf-8"
                  self.send_body(data,ctype)
              def do_HEAD(self): self.do_GET()
              def log_message(self,fmt,*args): print("[stage1g-hf-preview] "+(fmt%args),flush=True)
          http.server.ThreadingHTTPServer(("0.0.0.0",PORT),Handler).serve_forever()
          PY

      - name: Start HTTPS tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/stage1g_hf_preview.py >/tmp/http.log 2>&1 &
          echo $! >/tmp/http.pid
          for attempt in $(seq 1 30); do curl --fail --silent "http://127.0.0.1:$PREVIEW_PORT/version.json" >/dev/null && break; sleep 1; done
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:$PREVIEW_PORT" >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          PREVIEW_URL=""
          for attempt in $(seq 1 60); do
            PREVIEW_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [[ -n "$PREVIEW_URL" ]] && break
            sleep 1
          done
          [[ -n "$PREVIEW_URL" ]]
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify preview
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --fail --silent --location --max-time 10 "$PREVIEW_URL/version.json" >/dev/null 2>&1 && break
            sleep 2
          done
          for path in / /sanad-ai /manifest.webmanifest /sw.js /version.json; do
            curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_URL$path" >/dev/null
          done
          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "PREVIEW_URL=$PREVIEW_URL"
            echo "VOICE_CANDIDATE_URL=$VOICE_CANDIDATE_URL"
          } | tee /tmp/stage1g-hf-preview.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stage1g-hf-preview-access
          path: /tmp/stage1g-hf-preview.txt
          retention-days: 1

      - name: Keep preview available
        env:
          PREVIEW_URL: ${{ steps.tunnel.outputs.preview_url }}
        shell: bash
        run: |
          echo "Stage 1G.HF preview: $PREVIEW_URL"
          for minute in $(seq 1 100); do
            kill -0 "$(cat /tmp/http.pid)" 2>/dev/null || exit 1
            kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null || exit 1
            sleep 60
          done
