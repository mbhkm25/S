name: Audience card one-time key repair
on:
  push:
    branches:
      - feature/admin-audience-campaigns
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-audience-campaigns
      - name: Repair card props
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/admin/AdminAudienceCampaigns.tsx')
          text = path.read_text()
          old = "function CampaignCard({campaign,reload,setError,setSuccess}:{campaign:AdminAudienceCampaign;reload:()=>Promise<void>;setError:(v:string|null)=>void;setSuccess:(v:string|null)=>void}) {"
          new = "function CampaignCard({campaign,reload,setError,setSuccess}:{key?: string;campaign:AdminAudienceCampaign;reload:()=>Promise<void>;setError:(v:string|null)=>void;setSuccess:(v:string|null)=>void}) {"
          if old not in text:
              raise SystemExit('CampaignCard signature not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminAudienceCampaigns.tsx
          git commit -m "Fix audience campaign card JSX key typing"
          git push origin HEAD:feature/admin-audience-campaigns
