name: Unified operation workflow quality

on:
  pull_request:
    paths:
      - 'supabase/migrations/*unified_operation*'
      - 'src/features/operations/OperationDetailsActionIntent.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'public/payment-inbox.html'
      - '.github/workflows/unified-operation-workflow-quality.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*unified_operation*'
      - 'src/features/operations/OperationDetailsActionIntent.tsx'
      - 'src/lib/paymentInboxApi.ts'
      - 'public/payment-inbox.html'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate source-of-truth database chain
        shell: bash
        run: |
          set -euo pipefail
          foundation='supabase/migrations/20260731181500_unified_operation_workflow_source_of_truth.sql'
          guard='supabase/migrations/20260731182100_guard_unified_operation_claim_permission.sql'
          read_models='supabase/migrations/20260731182000_unified_operation_workflow_read_models.sql'
          for file in "$foundation" "$guard" "$read_models"; do test -s "$file"; done
          grep -Fq 'complete_operation_workflow' "$foundation"
          grep -Fq 'complete_business_payment' "$foundation"
          grep -Fq 'complete_operation_workflow_core' "$guard"
          grep -Fq 'get_operation_workflow_timeline' "$read_models"
      - name: Validate app-shell action intent
        shell: bash
        run: |
          set -euo pipefail
          intent='src/features/operations/OperationDetailsActionIntent.tsx'
          api='src/lib/paymentInboxApi.ts'
          grep -Fq 'claimPaymentInboxItem' "$intent"
          grep -Fq 'completePaymentInboxItem' "$intent"
          grep -Fq "document.getElementById('btn_confirm_verify')" "$intent"
          grep -Fq "includes('فتح الملف الأصلي')" "$intent"
          grep -Fq 'complete_business_payment_v2' "$api"
          grep -Fq '/business/manage/operations' public/payment-inbox.html
