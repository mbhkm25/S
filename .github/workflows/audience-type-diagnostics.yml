name: Audience UI one-time type diagnostics
on:
  push:
    branches:
      - feature/admin-audience-campaigns
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-audience-campaigns
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture TypeScript diagnostics
        run: |
          set +e
          npx tsc --noEmit > audience-type-diagnostics.txt 2>&1
          code=$?
          echo "exit_code=$code" >> audience-type-diagnostics.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audience-type-diagnostics.txt
          git commit -m "Capture audience campaign TypeScript diagnostics"
          git push origin HEAD:feature/admin-audience-campaigns
