name: Business workspaces quality

on:
  pull_request:
    paths:
      - 'src/components/business/BusinessWorkspacesAccess.tsx'
      - 'src/components/business/BusinessOperations.tsx'
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/components/Profile.tsx'
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-admin.html'
      - 'supabase/migrations/*business_workspaces*'
      - '.github/workflows/business-workspaces-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/business/BusinessWorkspacesAccess.tsx'
      - 'src/components/business/BusinessOperations.tsx'
      - 'src/components/business/PaymentInbox.tsx'
      - 'src/components/Profile.tsx'
      - 'public/payment-inbox.html'
      - 'public/payment-inbox-admin.html'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate workspace and payment inbox routing
        shell: bash
        run: |
          set -euo pipefail
          test -s src/components/business/BusinessWorkspacesAccess.tsx
          grep -Fq 'BusinessWorkspacesAccess' src/components/Profile.tsx
          grep -Fq 'get_my_business_workspaces' src/components/business/BusinessWorkspacesAccess.tsx
          grep -Fq "view === 'payment-inbox'" src/components/business/BusinessOperations.tsx
          grep -Fq "view === 'payment-inbox-admin'" src/components/business/BusinessOperations.tsx
          grep -Fq '/business/manage/operations' public/payment-inbox.html
          grep -Fq '/business/manage/operations' public/payment-inbox-admin.html
      - name: Validate member discovery permissions
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260731173000_business_workspaces_member_access.sql'
          test -s "$migration"
          grep -Fq 'get_my_business_workspaces' "$migration"
          grep -Fq "member.status = 'active'" "$migration"
          grep -Fq 'private.has_business_payment_permission' "$migration"
          grep -Fq 'grant execute on function public.get_my_business_workspaces() to authenticated' "$migration"
          ! grep -Eiq 'update[[:space:]]+public\.business_team_members' "$migration"
