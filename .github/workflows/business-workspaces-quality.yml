name: Business workspaces quality

on:
  pull_request:
    paths:
      - "src/components/business/BusinessWorkspacesAccess.tsx"
      - "src/components/Profile.tsx"
      - "src/components/notifications/NotificationBell.tsx"
      - "public/payment-inbox.html"
      - "public/payment-inbox-navigation.js"
      - "supabase/migrations/*business_workspaces*"
      - ".github/workflows/business-workspaces-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check navigation JavaScript
        run: node --check public/payment-inbox-navigation.js

      - name: Validate workspace assets
        shell: bash
        run: |
          set -euo pipefail
          test -s src/components/business/BusinessWorkspacesAccess.tsx
          test -s public/payment-inbox-navigation.js
          grep -Fq 'BusinessWorkspacesAccess' src/components/Profile.tsx
          grep -Fq 'get_my_business_workspaces' src/components/business/BusinessWorkspacesAccess.tsx
          grep -Fq 'get_my_business_workspaces' src/components/notifications/NotificationBell.tsx
          grep -Fq 'business_id' src/components/business/BusinessWorkspacesAccess.tsx
          grep -Fq 'return_to' src/components/business/BusinessWorkspacesAccess.tsx
          grep -Fq 'paymentInboxBackLink' public/payment-inbox.html
          grep -Fq '/payment-inbox-navigation.js' public/payment-inbox.html

      - name: Enforce membership discovery without permission escalation
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260731173000_business_workspaces_member_access.sql'
          test -s "$migration"
          grep -Fq 'get_my_business_workspaces' "$migration"
          grep -Fq "member.status = 'active'" "$migration"
          grep -Fq 'private.has_business_payment_permission' "$migration"
          grep -Fq "grant execute on function public.get_my_business_workspaces() to authenticated" "$migration"
          ! grep -Eiq 'update[[:space:]]+public\.business_team_members' "$migration"
          ! grep -Eiq 'insert[[:space:]]+into[[:space:]]+public\.business_team_members' "$migration"
          ! grep -Eiq 'permissions[[:space:]]*=' "$migration"

      - name: Enforce member-safe return navigation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'/profile#business-workspaces'" public/payment-inbox-navigation.js
          grep -Fq "'/business/manage'" public/payment-inbox-navigation.js
          grep -Fq "requested.startsWith('//')" public/payment-inbox-navigation.js
