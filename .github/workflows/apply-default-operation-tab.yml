name: Apply default operation details tab

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-default-operation-tab.yml'
      - '.github/scripts/set-default-operation-tab-document.py'
      - 'src/features/operations/OperationDetailsRuntimeV2.tsx'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operation-details-default-document-tab
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply default tab patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/scripts/set-default-operation-tab-document.py ]; then
            python .github/scripts/set-default-operation-tab-document.py
            rm .github/scripts/set-default-operation-tab-document.py
          fi

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q "useState<Tab>('document')" src/features/operations/OperationDetailsRuntimeV2.tsx
          npx tsc --noEmit
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Open operation details on the document tab"
            git pull --rebase origin fix/operation-details-default-document-tab
            git push origin HEAD:fix/operation-details-default-document-tab
          fi
