name: Deploy SANAD Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full main commit SHA. Leave empty to deploy current main."
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/production-recovery-trigger'

permissions:
  contents: read

concurrency:
  group: sanad-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve requested release
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          RELEASE_SHA="${REQUESTED_SHA:-$MAIN_SHA}"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          if [[ "$RELEASE_SHA" != "$MAIN_SHA" ]]; then
            echo "Deploying an earlier commit from main: $RELEASE_SHA"
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and route checks
        run: |
          npm run lint
          npm run check:routes

      - name: Production build
        run: npm run build

      - name: Enforce production bundle budget
        run: npm run check:bundle-budget

  deploy:
    name: Deploy to app.sanadflow.com
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://app.sanadflow.com
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
    steps:
      - name: Checkout release contract
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify SANAD Agent backend contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"

          required_versions=(
            20260920071058
            20260920121801
            20260920121807
            20260920121815
            20260920121821
          )

          version_sql="select version from supabase_migrations.schema_migrations where version in ('20260920071058','20260920121801','20260920121807','20260920121815','20260920121821') order by version;"

          migration_json="$(
            jq -n --arg query "$version_sql" '{query: $query}' |
              curl --fail-with-body --silent --show-error                 --request POST                 --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only"                 --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"                 --header "Content-Type: application/json"                 --data-binary @-
          )"

          printf '%s\n' "$migration_json" | jq .

          for version in "${required_versions[@]}"; do
            if ! jq -e --arg version "$version" '
              [.. | objects | select((.version? // "") == $version)] | length > 0
            ' <<<"$migration_json" >/dev/null; then
              echo "SANAD Agent backend migration is not aligned in production: $version" >&2
              exit 1
            fi
          done

          function_list="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
          printf '%s\n' "$function_list"
          for fn in             sanad-ai-agent-v1             sanad-ai-transcribe-v1             sanad-ai-attachment-analyze-v1; do
            grep -q "$fn" <<<"$function_list" || {
              echo "Required SANAD Agent Edge Function is missing in production: $fn" >&2
              exit 1
            }
          done

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          [[ -n "$SSH_KNOWN_HOSTS" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run guarded server deployment
        shell: bash
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          PORT: ${{ secrets.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail
          [[ -n "$HOST" ]]
          [[ -n "$DEPLOY_USER" ]]
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "sudo /usr/local/sbin/sanad-deploy-production '$RELEASE_SHA'"

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            APP_OK=0
            APK_OK=0
            curl --fail --silent --show-error --location --max-time 30 https://app.sanadflow.com/ >/dev/null && APP_OK=1
            curl --fail --silent --show-error --location --head --max-time 30 https://app.sanadflow.com/downloads/sanad-latest.apk >/dev/null && APK_OK=1
            if [[ "$APP_OK" -eq 1 && "$APK_OK" -eq 1 ]]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
