name: Temporary unified payment verification v89 patch

on:
  push:
    branches:
      - fix/unified-payment-verification-v89

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-payment-verification-v89
          fetch-depth: 0
      - name: Apply focused product and verification fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Unified naming in home and bottom navigation.
          replace_once(
              'src/components/Home.tsx',
              "title: 'رفع إشعار',\n    description: 'أرسل إشعارًا ماليًا جديدًا',",
              "title: 'إضافة عملية دفع',\n    description: 'صوّر أو أضف مستند دفع',",
          )
          replace_once(
              'src/App.tsx',
              '<span className="text-[9px] font-bold font-arabic mt-0.5">رفع إشعار</span>',
              '<span className="text-[9px] font-bold font-arabic mt-0.5">إضافة عملية</span>',
          )

          # Central visible release marker.
          app = Path('src/App.tsx')
          app_text = app.read_text(encoding='utf-8')
          import_anchor = "import { reportPushError } from './features/push/pushErrors';\n"
          if "SANAD_APP_VERSION" not in app_text:
              app_text = app_text.replace(import_anchor, import_anchor + "import { SANAD_APP_VERSION } from './lib/appVersion';\n", 1)
          logo_old = '''            <div className="flex items-center">\n              <img\n                src={`${import.meta.env.BASE_URL}logo.png`}\n                alt="شعار سند"\n                className="h-10 w-auto object-contain"'''
          logo_new = '''            <div className="flex items-center gap-2">\n              <div className="flex flex-col items-start">\n                <img\n                  src={`${import.meta.env.BASE_URL}logo.png`}\n                  alt="شعار سند"\n                  className="h-10 w-auto object-contain"'''
          if logo_old not in app_text:
              raise SystemExit('App logo anchor not found')
          app_text = app_text.replace(logo_old, logo_new, 1)
          close_old = '''                }}\n              />\n            </div>\n\n            <div>'''
          close_new = '''                  }}\n                />\n                <span className="-mt-1 self-center font-mono text-[8px] font-bold tracking-wider text-slate-400" dir="ltr">V{SANAD_APP_VERSION}</span>\n              </div>\n            </div>\n\n            <div>'''
          if close_old not in app_text:
              raise SystemExit('App logo close anchor not found')
          app_text = app_text.replace(close_old, close_new, 1)
          app.write_text(app_text, encoding='utf-8')

          Path('src/lib/appVersion.ts').write_text("export const SANAD_APP_VERSION = '89';\n", encoding='utf-8')

          # Ensure dynamic filenames are rendered with Latin digits.
          upload = Path('src/components/Upload.tsx')
          upload_text = upload.read_text(encoding='utf-8')
          import_anchor = "import { getPublicAppUrl } from '../lib/urlUtils';\n"
          if "toLatinDigits" not in upload_text:
              upload_text = upload_text.replace(import_anchor, import_anchor + "import { toLatinDigits } from '../lib/digits';\n", 1)
          upload_text = upload_text.replace('{file.name}</strong>', '{toLatinDigits(file.name)}</strong>')
          upload.write_text(upload_text, encoding='utf-8')

          # Uploader information must not suppress the explicit verification action.
          details = Path('src/components/Details.tsx')
          details_text = details.read_text(encoding='utf-8')
          old_start = '''      {/* 5. Verification & Linking Box based on User Role */}\n      {isUploader ? ('''
          new_start = '''      {/* 5. Operation origin and explicit verification are separate concepts. */}\n      {isUploader && ('''
          if old_start not in details_text:
              raise SystemExit('Details uploader condition start not found')
          details_text = details_text.replace(old_start, new_start, 1)
          old_transition = '''        </div>\n      ) : isVerifiedByMe ? ('''
          new_transition = '''        </div>\n      )}\n\n      {isVerifiedByMe ? ('''
          if old_transition not in details_text:
              raise SystemExit('Details uploader condition transition not found')
          details_text = details_text.replace(old_transition, new_transition, 1)
          details_text = details_text.replace('هذه العملية منشأة بواسطتك في سند', 'هذه العملية أضفتها إلى سند', 1)
          details_text = details_text.replace(
              'لقد قمت برفع مستند هذه العملية بنجاح. شارك رمز الاستجابة السريعة (QR) أو الرابط مع الطرف الآخر للمطابقة والتأكيد المتبادل.',
              'تم تسجيلك كرافع للمستند. يبقى التحقق إجراءً مستقلًا لتأكيد أنك راجعت العملية وطابقت بياناتها.',
              1,
          )
          details_text = details_text.replace('تم تسجيل تحققك من هذا الإشعار.', 'تم تسجيل تحققك من هذه العملية.', 1)
          details_text = details_text.replace('تأكيد ومطابقة الإشعار المالي الشخصي', 'تأكيد ومطابقة عملية الدفع', 1)
          details_text = details_text.replace('لقد قمت بالتحقق من هذا الإشعار مسبقاً', 'لقد قمت بالتحقق من هذه العملية مسبقًا', 1)
          details.write_text(details_text, encoding='utf-8')

          # Version metadata for automated deployment checks.
          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          if 'name="sanad-app-version"' in index_text:
              import re
              index_text = re.sub(r'<meta name="sanad-app-version" content="[^"]+"\s*/?>', '<meta name="sanad-app-version" content="89" />', index_text)
          else:
              index_text = index_text.replace('<meta name="theme-color" content="#111827" />', '<meta name="theme-color" content="#111827" />\n    <meta name="sanad-app-version" content="89" />', 1)
          index.write_text(index_text, encoding='utf-8')

          # Remove this temporary workflow before committing the product patch.
          Path('.github/workflows/temp-unified-payment-verification-v89.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify payment naming and restore explicit uploader verification"
          git push origin HEAD:fix/unified-payment-verification-v89
