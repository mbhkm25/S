name: Deploy hardened operation analyzer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-operation-analyzer-v3.yml'
      - 'supabase/functions/sanad-v3-analyze-operation/**'
      - 'supabase/migrations/**operation_analysis_contract**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install project dependencies
        run: npm ci

      - name: Validate analyzer
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'identity_only_receiver_requires_account_recovery' supabase/functions/sanad-v3-analyze-operation/extraction-v3.ts
          grep -q 'sameEntity && sameType && !sameValue' supabase/functions/sanad-v3-analyze-operation/extraction-v3.ts
          grep -q 'identifier is NonNullable<ReturnType<typeof normalizePartyIdentifier>>' supabase/functions/sanad-v3-analyze-operation/index.ts
          grep -q 'identifier_persistence_projection' supabase/functions/sanad-v3-analyze-operation/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/sanad-v3-analyze-operation/index.ts
          deno test --allow-none supabase/functions/sanad-v3-analyze-operation/identifier-contract.test.ts
          npx tsc --noEmit

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Deploy analyzer preserving custom authentication
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy sanad-v3-analyze-operation \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
