name: Deploy hardened operation analyzer

on:
  push:
    branches:
      - feature/operation-details-v3-extraction-preview-hardening
    paths:
      - '.github/workflows/deploy-operation-analyzer-v3.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operation-details-v3-extraction-preview-hardening
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Deploy analyzer preserving custom authentication
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy sanad-v3-analyze-operation \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Remove one-shot deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/deploy-operation-analyzer-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete hardened operation analyzer deployment"
          git push origin HEAD:feature/operation-details-v3-extraction-preview-hardening
