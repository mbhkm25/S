name: Deploy hardened operation analyzer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-operation-analyzer-v3.yml'
      - 'supabase/functions/sanad-v3-analyze-operation/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

      - name: Deploy analyzer preserving custom authentication
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy sanad-v3-analyze-operation \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
