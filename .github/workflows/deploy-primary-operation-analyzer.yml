name: Validate primary operation analyzer

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/sanad-operation-analysis-primary/**'
      - 'supabase/functions/sanad-operation-analysis-worker/**'
      - '.github/workflows/deploy-primary-operation-analyzer.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/sanad-operation-analysis-primary/**'
      - 'supabase/functions/sanad-operation-analysis-worker/**'
      - '.github/workflows/deploy-primary-operation-analyzer.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install project dependencies
        run: npm ci

      - name: Validate primary analyzer and worker
        run: |
          set -euo pipefail
          deno check --config supabase/functions/sanad-operation-analysis-primary/deno.json supabase/functions/sanad-operation-analysis-primary/index.ts
          deno check --config supabase/functions/sanad-operation-analysis-worker/deno.json supabase/functions/sanad-operation-analysis-worker/index.ts
          grep -q 'sanad-operation-analysis-primary' supabase/functions/sanad-operation-analysis-worker/index.ts
          grep -q 'original_document_is_source_of_truth: true' supabase/functions/sanad-operation-analysis-primary/index.ts
          grep -q 'callLegacyFallback' supabase/functions/sanad-operation-analysis-primary/index.ts
          grep -q 'existingStructured' supabase/functions/sanad-operation-analysis-primary/index.ts
          grep -q 'existingRaw' supabase/functions/sanad-operation-analysis-primary/index.ts
          grep -q 'existing.status === "verified"' supabase/functions/sanad-operation-analysis-primary/index.ts
