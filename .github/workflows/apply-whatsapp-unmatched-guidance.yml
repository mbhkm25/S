name: Apply WhatsApp unmatched guidance patch

on:
  workflow_dispatch:
  push:
    branches:
      - feature/whatsapp-unmatched-guidance
    paths:
      - scripts/patch-whatsapp-unmatched-guidance.py
      - .github/workflows/apply-whatsapp-unmatched-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/whatsapp-unmatched-guidance
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-whatsapp-unmatched-guidance.py
      - name: Validate Deno source formatting markers
        run: |
          grep -q 'whatsapp_sender_guidance_sent' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -q 'sanad_show_operation:' supabase/functions/sanad-v3-whatsapp-intake/index.ts
          grep -q 'claim_operation_sender_guidance' supabase/functions/sanad-v3-whatsapp-intake/index.ts
      - name: Commit generated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/sanad-v3-whatsapp-intake/index.ts
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Implement WhatsApp guidance for unmatched operations'
            git push origin HEAD:feature/whatsapp-unmatched-guidance
          fi
