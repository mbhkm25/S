name: Apply identifier contract fix

on:
  push:
    branches:
      - feature/sanad-fast-financial-engine
    paths:
      - '.github/workflows/apply-identifier-contract-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sanad-fast-financial-engine
          fetch-depth: 0

      - name: Integrate persistence projection
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/sanad-v3-analyze-operation/index.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = '''} from "./extraction-v3.ts";\n'''
          import_replacement = '''} from "./extraction-v3.ts";\nimport {\n  buildIdentifierPersistenceProjection,\n  toOperationIdentifierType,\n} from "./identifier-contract.ts";\n'''
          if 'from "./identifier-contract.ts"' not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(import_anchor, import_replacement, 1)

          persist_anchor = '''    const persistStartedAtMs = Date.now();\n    await patchOperation(operation.id, {\n'''
          persist_replacement = '''    const persistStartedAtMs = Date.now();\n    const receiverIdentifierProjection = buildIdentifierPersistenceProjection(\n      normalized.receiver_identifier_type,\n    );\n    await patchOperation(operation.id, {\n'''
          if 'const receiverIdentifierProjection = buildIdentifierPersistenceProjection' not in text:
              if persist_anchor not in text:
                  raise SystemExit('persist anchor not found')
              text = text.replace(persist_anchor, persist_replacement, 1)

          metadata_anchor = '''          selected_identifier: finalAssessment.selectedIdentifier,\n          unique_identifier_count: finalAssessment.uniqueIdentifierCount,\n          review_required: reviewRequired,\n'''
          metadata_replacement = '''          selected_identifier: finalAssessment.selectedIdentifier,\n          unique_identifier_count: finalAssessment.uniqueIdentifierCount,\n          identifier_persistence_projection: receiverIdentifierProjection,\n          review_required: reviewRequired,\n'''
          if 'identifier_persistence_projection: receiverIdentifierProjection' not in text:
              if metadata_anchor not in text:
                  raise SystemExit('metadata anchor not found')
              text = text.replace(metadata_anchor, metadata_replacement, 1)

          field_anchor = '''      receiver_identifier_type: normalized.receiver_identifier_type,\n      reference_number: normalized.reference_number,\n'''
          field_replacement = '''      receiver_identifier_type: toOperationIdentifierType(\n        normalized.receiver_identifier_type,\n      ),\n      reference_number: normalized.reference_number,\n'''
          if field_replacement not in text:
              if field_anchor not in text:
                  raise SystemExit('field anchor not found')
              text = text.replace(field_anchor, field_replacement, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify contract integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'buildIdentifierPersistenceProjection' supabase/functions/sanad-v3-analyze-operation/index.ts
          grep -q 'toOperationIdentifierType' supabase/functions/sanad-v3-analyze-operation/index.ts
          grep -q 'identifier_persistence_projection' supabase/functions/sanad-v3-analyze-operation/index.ts

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/sanad-v3-analyze-operation/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(analyzer): project semantic identifiers before persistence'
          git push origin HEAD:feature/sanad-fast-financial-engine
