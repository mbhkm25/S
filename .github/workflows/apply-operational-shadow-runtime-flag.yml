name: Apply operational shadow runtime flag

on:
  push:
    branches:
      - feature/sanad-fast-financial-engine
    paths:
      - scripts/apply-operational-shadow-runtime-flag.py

permissions:
  contents: write

jobs:
  apply-flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sanad-fast-financial-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply-operational-shadow-runtime-flag.py
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/sanad-v3-analyze-operation/index.ts
          git commit -m "feat(shadow): use deterministic runtime sampling flag"
          git push origin HEAD:feature/sanad-fast-financial-engine
