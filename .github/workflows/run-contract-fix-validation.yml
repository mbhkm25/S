name: Run identifier contract validation

on:
  push:
    branches:
      - feature/sanad-fast-financial-engine
    paths:
      - '.github/workflows/run-contract-fix-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hudbzlgclghlhazlduas
      RUN_TOKEN: contract-fix-20260806
      VALIDATION_ROUND: database-contract-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sanad-fast-financial-engine

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy allow-listed validation runner
        run: |
          set -euo pipefail
          supabase functions deploy sanad-contract-fix-validation \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Reprocess the two contract failures
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 180 \
            -X POST \
            -H "x-run-token: $RUN_TOKEN" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/sanad-contract-fix-validation"

      - name: Close validation runner
        if: always()
        run: |
          set -euo pipefail
          cat > supabase/functions/sanad-contract-fix-validation/index.ts <<'EOF'
          import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          Deno.serve(() => new Response(JSON.stringify({ ok: false, error: "validation_runner_closed" }), {
            status: 410,
            headers: { "content-type": "application/json", "cache-control": "no-store" },
          }));
          EOF
          supabase functions deploy sanad-contract-fix-validation \
            --project-ref "$SUPABASE_PROJECT_REF"
