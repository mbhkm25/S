  http: ^1.5.0
  connectivity_plus: ^6.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.1.0
  mobile_scanner: ^7.0.1
