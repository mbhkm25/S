name: sanad_local
description: SANAD Local cashier-first Android application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
