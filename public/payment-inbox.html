<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>وارد المدفوعات | سند</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/sanad-ui-standards.css" />
  <link rel="stylesheet" href="/payment-inbox.css" />
  <link rel="stylesheet" href="/payment-inbox-shadow-preview.css" />
  <link rel="stylesheet" href="/payment-inbox-cashier-ui.css?v=20260803-2" />
</head>
<body class="payment-inbox-page cashier-mode">
  <div class="shell">
    <header class="hero cashier-hero">
      <div class="hero-topline">
        <div class="hero-copy"><h1>وارد المدفوعات</h1></div>
        <div class="hero-actions">
          <button id="refreshButton" class="icon-button" type="button" aria-label="تحديث">↻</button>
          <a id="paymentInboxBackLink" class="icon-button" href="/profile#business-workspaces" aria-label="العودة">←</a>
        </div>
      </div>

      <section class="hero-operations" aria-label="سياق وارد المدفوعات">
        <div class="hero-business">
          <select id="businessSelect" aria-label="اختيار النشاط التجاري"></select>
          <div id="connectionState" class="connection-pill offline"><span></span> جارٍ الاتصال</div>
        </div>

        <nav class="tabs hero-tabs cashier-tabs" aria-label="حالات وارد المدفوعات">
          <button type="button" data-status="new" class="active">جديدة</button>
          <button type="button" data-status="claimed">لدي</button>
        </nav>

        <a id="paymentInboxAdminLink" class="inbox-admin-link" href="/payment-inbox-admin.html" hidden>
          <span>إدارة وارد المدفوعات</span><span aria-hidden="true">←</span>
        </a>
      </section>
    </header>

    <div id="notice" class="notice hidden" role="status"></div>
    <section id="statsSection" class="stats-grid" aria-hidden="true"></section>

    <main id="queueSection" class="queue-list" aria-live="polite" aria-busy="true">
      <div class="panel loading"><div class="spinner"></div></div>
    </main>
  </div>

  <nav class="sanad-bottom-nav" aria-label="التنقل الرئيسي">
    <a href="/" aria-label="الرئيسية"><span aria-hidden="true">⌂</span><small>الرئيسية</small></a>
    <a href="/operations" aria-label="العمليات"><span aria-hidden="true">▤</span><small>العمليات</small></a>
    <a class="active" href="/payment-inbox.html" aria-current="page"><span aria-hidden="true">⇩</span><small>الوارد</small></a>
    <a href="/profile" aria-label="حسابي"><span aria-hidden="true">◉</span><small>حسابي</small></a>
  </nav>

  <div id="actionModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <section class="modal-card" role="dialog" aria-modal="true">
      <header><div><p class="eyebrow">وارد المدفوعات</p><h2 id="modalTitle">العملية</h2></div><button id="closeModal" class="close" type="button" aria-label="إغلاق">×</button></header>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <script src="/sanad-supabase-runtime.js"></script>
  <script src="/sanad-display-standards.js" defer></script>
  <script src="/payment-inbox-navigation.js" defer></script>
  <script src="/payment-inbox-v2-compatibility.js?v=20260803-1" defer></script>
  <script src="/payment-inbox-workflow-hardening.js?v=20260802-1" defer></script>
  <script src="/payment-inbox.js?v=20260801-1" defer></script>
  <script src="/payment-inbox-workflow-state.js" defer></script>
  <script src="/payment-inbox-review-resolution.js?v=20260802-1" defer></script>
  <script src="/payment-inbox-identity-display.js?v=20260802-1" defer></script>
  <script src="/payment-inbox-cashier-ui.js?v=20260803-2" defer></script>
</body>
</html>
