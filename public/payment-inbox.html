<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>وارد المدفوعات | سند</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/sanad-ui-standards.css" />
  <link rel="stylesheet" href="/payment-inbox.css" />
  <link rel="stylesheet" href="/payment-inbox-shadow-preview.css" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">سند للأعمال · تشغيل مشترك</p>
        <h1>وارد المدفوعات</h1>
        <p>استلم العملية على جهازك، راجع الإشعار، ثم أكملها دون تسليم هاتف العميل أو تكرار العمل بين الكاشيرات.</p>
      </div>
      <div class="hero-actions">
        <button id="refreshButton" class="icon-button" type="button" aria-label="تحديث">↻</button>
        <a id="paymentInboxBackLink" class="icon-button" href="/profile#business-workspaces" aria-label="العودة إلى مساحات العمل">←</a>
      </div>
    </header>

    <div id="notice" class="notice hidden" role="status"></div>

    <section class="panel context-panel">
      <label>النشاط التجاري
        <select id="businessSelect"></select>
      </label>
      <div id="connectionState" class="connection-pill offline"><span></span> جارٍ الاتصال</div>
    </section>

    <section id="statsSection" class="stats-grid"></section>

    <nav class="tabs" aria-label="حالات وارد المدفوعات">
      <button type="button" data-status="new" class="active">جديدة</button>
      <button type="button" data-status="claimed">لدي</button>
      <button type="button" data-status="review_required">تحتاج مراجعة</button>
      <button type="button" data-status="completed">مكتملة</button>
      <button type="button" data-status="shadow_preview" aria-label="المطابقات التجريبية في وضع الظل">تجريبية</button>
    </nav>

    <main id="queueSection" class="queue-list">
      <div class="panel loading"><div class="spinner"></div></div>
    </main>
  </div>

  <div id="actionModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <section class="modal-card" role="dialog" aria-modal="true">
      <header><div><p class="eyebrow">إجراء تشغيلي</p><h2 id="modalTitle">العملية</h2></div><button id="closeModal" class="close" type="button">×</button></header>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <script src="/sanad-supabase-runtime.js"></script>
  <script src="/sanad-display-standards.js" defer></script>
  <script src="/payment-inbox-navigation.js" defer></script>
  <script src="/payment-inbox-shadow-preview.js" defer></script>
  <script src="/payment-inbox.js" defer></script>
</body>
</html>
